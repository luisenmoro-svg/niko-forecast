// ---------- Fuente y fecha de actualización ----------
function cdmx(iso) {
  if (!iso) return 'sin fecha';
  try {
    return new Date(iso).toLocaleString('es-MX', { timeZone: 'America/Mexico_City',
      day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' CDMX';
  } catch (e) { return String(iso); }
}
function fuenteHubspot(raw) {
  const s = (raw.snaps || []).find(x => x.snapshot_date === raw.ultima);
  return `HubSpot · foto del ${esc(raw.ultima)}, tomada el ${esc(cdmx(s && s.creado))}`;
}
function fuenteManual(filas, etiqueta) {
  const fechas = (filas || []).map(f => f.actualizado_en).filter(Boolean).sort();
  const ultima = fechas[fechas.length - 1];
  return `Tickets Manual · ${esc(etiqueta)}${ultima ? ` · cargado el ${esc(cdmx(ultima))}` : ' · sin fecha de carga'}`;
}

function cifra(clase, n, l, s, mk) { return `<div class="cifra ${clase}"><div class="l">${mk ? `<i class="mk ${mk}" aria-hidden="true"></i>` : ''}${l}</div><div class="n">${n}</div><div class="s">${s}</div></div>`; }
function v(x) { return ESTADO.unidad === 'sitios' ? fmt.format(x.sitios) : fmt.format(x.kwp); }
function u(n) { return ESTADO.unidad === 'sitios' ? (n === 1 ? 'sitio' : 'sitios') : 'kWp'; }
function nSitios(n) { return `${fmt.format(n)} ${n === 1 ? 'sitio' : 'sitios'}`; }

// En sitios es un conteo y se puede cotejar; en kWp es una suma y se explica.
const opU = (ds, que) => ESTADO.unidad === 'sitios' ? undefined
  : { explica: `Suma de kWp de ${fmt.format(ds.length)} ${ds.length === 1 ? 'sitio' : 'sitios'} ${que}: ${fmt1.format(ds.reduce((a, d) => a + (d.kwp || 0), 0))} kWp`, ordenar: 'kwp' };
const opHoras = (ts, que) => ({ explica: `Suma del esfuerzo del catálogo de ${fmt.format(ts.length)} ${ts.length === 1 ? 'ticket' : 'tickets'} ${que}: ${fmt1.format(ts.reduce((a, t) => a + (t.horas || 0), 0))} h`, ordenar: 'atraso' });
const opPct = (ts, que) => ({ explica: `${fmt.format(ts.filter(t => t.edad <= t.sla).length)} de ${fmt.format(ts.length)} ${que} cerraron dentro de su SLA`, ordenar: 'atraso' });
const opMediana = (ts, valor) => ({
  explica: `Mediana de ${fmt1.format(valor)} días hábiles sobre ${fmt.format(ts.length)} ${ts.length === 1 ? 'ticket abierto' : 'tickets abiertos'}, ordenados por edad`,
  ordenar: 'edad',
  resaltar: filas => { const n = filas.length; return new Set(n % 2 ? [(n - 1) / 2] : [n / 2 - 1, n / 2]); },
});
const opUtil = (ts, quien, req, disp) => ({ explica: `${fmt1.format(req)} h requeridas entre ${fmt1.format(disp)} h disponibles de ${quien}. Los ${fmt.format(ts.length)} abiertos que forman las horas requeridas:`, ordenar: 'atraso' });

function vistaMeta(M) {
  const k = ESTADO.unidad;
  const g = M.goal[k] || 1;
  const tope = Math.max(g, M.forecast[k], M.plan[k]) * 1.08;
  const delta = M.forecast[k] - M.goal[k];
  const [a, m] = ESTADO.mes.split('-').map(Number);
  return `<section class="meta" aria-label="Meta del mes">
    <div class="meta-cifras">
      ${cifra('goal', v(M.goal), 'Company Goal', `Lo prometido para ${MESES[m - 1]} ${a}`, 'goal')}
      ${cifra('forecast', num(v(M.forecast), 'Forecast del mes', M.listas.forecast, 'sitios', opU(M.listas.forecast, 'que entran en el forecast')), 'Forecast', `Lo que la capacidad actual alcanza a entregar, de ${num(v(M.plan), 'Sitios comprometidos del mes', M.listas.plan, 'sitios', opU(M.listas.plan, 'comprometidos'))} comprometidos`, 'fc')}
      ${cifra('real', num(v(M.real), 'Real del mes', M.listas.real, 'sitios', opU(M.listas.real, 'ya instalados')), 'Real', `${ESTADO.unidad === 'sitios' ? 'Sitios' : 'kWp'} que ya llegaron a instalación`, 're')}
      ${cifra('delta ' + (delta < 0 ? 'neg' : 'pos'), num_delta((delta > 0 ? '+' : '') + fmt.format(delta), 'Delta: de dónde sale la brecha', {
        unidad: k === 'sitios' ? 'Sitios' : 'kWp', goal: M.goal[k], plan: M.plan[k], forecast: M.forecast[k],
        // Las dos partes suman el delta por construcción: (plan−goal) + (forecast−plan) = forecast−goal.
        aportePlan: M.plan[k] - M.goal[k], aporteCapacidad: M.forecast[k] - M.plan[k], delta,
        fuera: M.fuera,
      }), 'Delta', `Forecast contra goal, en ${u()}`)}
    </div>
    <div class="barra" role="img" aria-label="Real ${v(M.real)}, forecast ${v(M.forecast)} y goal ${v(M.goal)} ${u()}">
      <div class="fc" style="width:${M.forecast[k] / tope * 100}%"></div>
      <div class="re" style="width:${M.real[k] / tope * 100}%"></div>
      <div class="gl" style="left:${g / tope * 100}%"></div>
    </div>
    <div class="barra-ejes"><span>0</span><span>${fmt.format(tope)} ${u(tope)}</span></div>
  </section>`;
}

function vistaCadena(etapas, sem) {
  const k = ESTADO.unidad;
  // Las etapas de post-instalación salen de config.js: acumulan histórico y conviene
  // leerlas aparte de la cadena viva. Se muestran como ruta fuera del flujo.
  const post = new Set(CFG.etapasPostInstalacion || []);
  const cadena = etapas.filter(e => !post.has(e.etapa_id));
  const fuera = etapas.filter(e => post.has(e.etapa_id));

  // Una fila por sección del pipeline.
  const grupos = (CFG.gruposEtapas || []).map(g => ({
    titulo: g.titulo,
    etapas: cadena.filter(e => (g.etapas || []).includes(e.etapa_id)),
  }));
  const asignadas = new Set(grupos.flatMap(g => g.etapas.map(e => e.etapa_id)));
  const ocultas = new Set(CFG.etapasOcultas || []);
  // Una etapa oculta se esconde solo mientras esté vacía: con sitios o kWp reaparece en «Otras».
  const sueltas = cadena.filter(e => !asignadas.has(e.etapa_id)
    && !(ocultas.has(e.etapa_id) && !e.sitios && !e.kwp));
  // Una etapa sin grupo nunca se esconde: cae en «Otras».
  if (sueltas.length) grupos.push({ titulo: 'Otras', etapas: sueltas });
  const filas = grupos.filter(g => g.etapas.length);

  // Cambio contra la foto T0. Sin segunda foto o sin cambio, no se escribe nada:
  // una barra sin meta contra qué compararse no decía nada.
  const base = (sem && sem.length > 1) ? sem[0].porEtapa : null;
  const signo = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt.format(Math.abs(n));
  const desdeT0 = e => {
    if (!base) return '';
    const b = base[e.etapa_id] || { sitios: 0, kwp: 0 };
    const ds = e.sitios - b.sitios, dk = e.kwp - b.kwp;
    if (!ds && !dk) return '';
    // Sin color: que una etapa baje suele querer decir que los sitios avanzaron,
    // no que algo esté mal. El rojo se reserva para errores (Niko_Look_and_Feel.md).
    return `<div class="t0d">${signo(ds)} ${Math.abs(ds) === 1 ? 'sitio' : 'sitios'} · ${signo(dk)} kWp desde T0</div>`;
  };

  const tarjeta = e => `
      <div class="etapa ${e.es_instalado ? 'inst' : ''}" title="${esc(e.etiqueta)}: ${nSitios(e.sitios)}, ${fmt1.format(e.kwp)} kWp">
        <div class="e">${esc(e.etiqueta)}</div>
        <div class="v">${num(k === 'sitios' ? e.sitios : fmt.format(e.kwp), `${e.etiqueta} · foto más reciente`, e.ds, 'sitios', opU(e.ds, `en ${e.etiqueta}`))}</div>
        <div class="k">${k === 'sitios' ? fmt.format(e.kwp) + ' kWp' : nSitios(e.sitios)}</div>
        ${desdeT0(e)}
      </div>`;
  const fila = g => `<div class="grupo">
      <div class="grupo-t">${esc(g.titulo)}</div>
      <div class="cadena-grid">${g.etapas.map(tarjeta).join('')}</div>
    </div>`;
  // El título, la definición y la fuente los pone la sección que la envuelve.
  return `<div class="cadena">
    ${filas.map(fila).join('')}
    ${fuera.length ? `<div class="fuera-flujo">
      <div class="grupo-t">Post-instalación</div>
      <p class="nota">Ya instalados. Cuentan en Real, no en la cadena.</p>
      <div class="cadena-grid">${fuera.map(tarjeta).join('')}</div>
    </div>` : ''}
  </div>`;
}

function pillSla(t) {
  if (t.estadoSla === 'vencido') return '<span class="pill bad">Vencido</span>';
  if (t.estadoSla === 'riesgo') return '<span class="pill warn">En riesgo</span>';
  if (t.estadoSla === 'ok') return '<span class="pill ok">A tiempo</span>';
  return '<span class="pill mute">Sin SLA</span>';
}
const slaTxt = d => d == null ? '—' : d < 1 ? `${fmt1.format(d * 8)} h` : `${fmt1.format(d)} d`;
const marcaSupuesto = (txt, firme) => firme ? txt : `<span class="supuesto" title="Valor del catálogo aún no firmado">${txt}</span>`;

// Explicación general del pronóstico, en el ⓘ de cada semana futura.
function infoSemana(P) {
  const ritmo = P.modoEntrada === 'meta'
    ? `entran ${fmt1.format(P.eMeta.sitios)} sitios por semana, los que pediría la meta`
    : P.modoEntrada === 'sin-historia'
      ? 'no se puede medir el ritmo de entrada, se usa el de la meta'
      : `entran ${fmt1.format(P.eReal.sitios)} sitios por semana, el ritmo real medido`;
  const esc2 = simActivo() ? ' Escenario del simulador: valores cambiados a mano.' : ' Escenario: datos reales, sin cambios del simulador.';
  return info_texto(`Pronóstico: parte de la semana anterior; cada etapa suelta los sitios que su equipo alcanza a cerrar (o los que marca el proceso), se aplican las pérdidas por etapa y se suman los sitios nuevos. Ritmo de entrada: ${ritmo}.${esc2} Clic en cualquier número para ver su cuenta.`);
}
function info_texto(t) {
  return ` <button class="info" type="button" aria-label="Cómo se calcula" data-def="${esc(t)}">i</button>`;
}

// Cada etapa dice de dónde sale su ritmo en el pronóstico.
function ritmoInfo(etapaId) {
  const r = (CFG.ritmoEtapas || []).find(x => x.id === etapaId);
  if (!r) return '';
  const t = r.modo === 'cola'
    ? `Ritmo: capacidad de ${r.equipo}. Sale cuando se cierra su ticket de «${r.ticket}», así que depende de cuántos alcance a cerrar el equipo esa semana.`
    : `Ritmo: según proceso, ${r.dias} días hábiles del Reverse Eng Model${r.nota ? ` (${r.nota})` : ''}. No lo gobierna ningún ticket.`;
  const conv = r.conversion != null && r.conversion < 1
    ? ` Solo el ${Math.round(r.conversion * 100)} % sigue adelante (${r.convFuente === 'medida' ? 'tasa medida con 12 meses de datos' : 'tasa del Reverse Eng Model'}).`
    : '';
  const ram = r.ramas && r.ramas.length > 1
    ? ` De los que salen, ${r.ramas.map(x => `${Math.round(x.frac * 100)} %`).join(' y ')} se reparten entre las etapas siguientes, según lo medido.`
    : '';
  return ` <button class="info" type="button" aria-label="De dónde sale su ritmo" data-def="${esc(t + conv + ram)}">i</button>`;
}

function vistaFlujo(M, raw) {
  const R = M.resumen, L = M.lResumen;
  const sem = M.semanas;
  const P = pronostico(M, ESTADO.sim);
  // Si existe un pronóstico guardado para esa fecha y etapa, se muestra junto al real.
  const guardados = raw.pronosGuardados || [];
  const prevision = (fecha, etapaId) => guardados.find(g => g.semana_fecha === fecha && g.etapa_id === etapaId) || null;
  const etapas = M.porEtapa;
  const delta = (a, b) => { const d = a - b; return d === 0 ? '' : `<span class="dif">${d > 0 ? '+' : '−'}${fmt.format(Math.abs(d))}</span>`; };
  // La serie histórica solo guarda ids: el nombre se toma de la foto más reciente.
  const nombrePorDeal = {};
  for (const e of etapas) for (const d of (e.ds || [])) nombrePorDeal[d.deal_id] = d.nombre;
  const sitiosDe = (s, e) => (s.filas || []).filter(r => r.etapa_id === e.etapa_id)
    .map(r => ({ deal_id: r.deal_id, nombre: nombrePorDeal[r.deal_id] || r.deal_id, kwp: r.kwp, etapaEtiqueta: e.etiqueta }));
  const vencidos = M.abiertos.filter(t => t.estadoSla === 'vencido').sort((a, b) => (b.edad - b.sla) - (a.edad - a.sla)).slice(0, 25);
  const fH = fuenteHubspot(raw);
  const fCat = fuenteManual(raw.catalogo, 'catálogo de tickets');
  // La post-instalación no se suma a la cadena: son sitios que ya salieron del flujo.
  const esPost = e => (CFG.etapasPostInstalacion || []).includes(e.etapa_id);
  const enCadena = etapas.filter(e => !esPost(e));
  const enPost = etapas.filter(esPost);
  const tot = ls => ({ s: ls.reduce((a, e) => a + e.sitios, 0), k: ls.reduce((a, e) => a + e.kwp, 0) });
  const tCadena = tot(enCadena), tPost = tot(enPost);

  return `
    <div class="resumen">
      <div><b>${num(fmt.format(R.abiertos), 'Tickets abiertos', L.abiertos, 'tickets')}</b><span>tickets abiertos ${info('abiertos')}</span></div>
      <div><b>${num(fmt.format(R.vencidos), 'Tickets fuera de SLA', L.vencidos, 'tickets')}</b><span>fuera de SLA ${info('vencidos')}</span></div>
      <div><b>${num(fmt.format(R.riesgo), 'Tickets en riesgo', L.riesgo, 'tickets')}</b><span>en riesgo ${info('riesgo')}</span></div>
      <div><b>${num(pct(R.cumplimiento), 'Cerrados en los últimos 28 días con SLA', L.cerrados28, 'tickets', opPct(L.cerrados28, 'cerrados en 28 días'))}</b><span>cerrados a tiempo ${info('cumplimiento')}</span></div>
      <div><b>${fmt.format(R.sitiosT0)} · ${fmt.format(R.kwpT0)}</b><span>sitios y kWp en T0 ${info('t0')}</span></div>
    </div>

    ${seccion('cadena', 'Dónde están hoy los sitios', 'cadena',
      `en la cadena ${fmt.format(tCadena.s)} sitios · ${fmt.format(tCadena.k)} kWp`
      + (enPost.length ? ` · post-instalación ${fmt.format(tPost.s)} sitios · ${fmt.format(tPost.k)} kWp` : ''),
      fH, vistaCadena(etapas, sem))}

    ${seccion('comoPron', 'Cómo se calcula el pronóstico', null,
      `${P.semanas.length} semanas · ${P.modoEntrada === 'real' ? 'ritmo real' : P.modoEntrada === 'meta' ? 'ritmo de la meta' : 'sin historia'}`,
      'Pronóstico preliminar · no usa los tiempos por etapa de HubSpot',
      `<ol class="comoPron">
        <li>Se parte de la foto más reciente: los sitios que hay hoy en cada etapa.</li>
        <li>Cada semana, una etapa suelta los sitios que su equipo alcanza a cerrar: las horas que tiene entre lo que cuesta su ticket. Si dos filas compiten por el mismo equipo, se reparten sus horas.</li>
        <li>Las etapas que no dependen de un ticket (los lotes de 2.01, la espera de cuadrilla en 2.14) sueltan la parte que marcan los días del modelo de Paola.</li>
        <li>De los que salen, una parte se pierde: cada etapa tiene su tasa de conversión. El resto llega a la siguiente.</li>
        <li>Al final entran los sitios nuevos de la semana, y lo que sale de la última etapa son las instalaciones.</li>
      </ol>
      <p class="nota"><b>Ritmo de entrada:</b> ${P.modoEntrada === 'meta'
          ? `${fmt1.format(P.eMeta.sitios)} sitios por semana, los que haría falta meter para la meta.`
          : P.modoEntrada === 'sin-historia'
            ? 'no medible todavía: hacen falta dos fotos separadas por una semana. Se usa el de la meta.'
            : `${fmt1.format(P.eReal.sitios)} sitios por semana, medidos entre las últimas ${P.eReal.intervalos} fotos.`}</p>
      <h3 style="font-size:13px;margin:10px 0 4px">Lo que el pronóstico supone</h3>
      <ul class="nota" style="margin:0;padding-left:18px">

        <li>Que dos filas que compiten por un equipo se reparten su tiempo por igual.</li>
        <li>Que el esfuerzo medido vale para adelante: sale de 4 semanas de cierres.</li>
        <li>Que no cambian ni el equipo ni el proceso durante las ${P.semanas.length} semanas.</li>
      </ul>
      ${P.sinEsfuerzo.length ? `<p class="aviso error">Estas filas no se pueden proyectar porque su ticket no tiene esfuerzo en el catálogo: ${P.sinEsfuerzo.map(esc).join(', ')}.</p>` : ''}`)}

    ${seccion('t0', 'Qué cambió desde T0', 'desdeT0',
      `${sem.length} fotos · total ${fmt.format(sem[sem.length - 1]?.sitios || 0)} sitios${sem.length > 1 ? ` (${(sem[sem.length - 1].sitios - sem[0].sitios) >= 0 ? '+' : '−'}${fmt.format(Math.abs(sem[sem.length - 1].sitios - sem[0].sitios))} desde T0)` : ''}`,
      fH, `${(() => {
        // Esta tabla compara VOLUMEN: cuántos sitios hay contra cuántos pediría la meta.

      })()}
      <div class="tabla"><table class="t0">
      <thead>
        <tr><th rowspan="2">Etapa</th><th rowspan="2">Escenario</th>${sem.map(s => `<th colspan="2" class="par" title="${s.fecha}">${s.etiqueta} <small>${s.fecha.slice(5)}</small></th>`).join('')}${P.semanas.map(f => `<th colspan="2" class="par fut">${f.etiqueta} <small>pronóstico</small>${infoSemana(P)}</th>`).join('')}</tr>
        <tr>${sem.map(() => '<th class="sub par">Sitios</th><th class="sub">kWp</th>').join('')}${P.semanas.map(() => '<th class="sub par fut">Sitios</th><th class="sub fut">kWp</th>').join('')}</tr>
      </thead>
      <tbody>${etapas.map(e => `<tr class="esc-real"><td rowspan="3">${esc(e.etiqueta)}${ritmoInfo(e.etapa_id)}</td><td class="esc">Real</td>${sem.map((s, i) => {
        const x = s.porEtapa[e.etapa_id] || { sitios: 0, kwp: 0 }, x0 = sem[0].porEtapa[e.etapa_id] || { sitios: 0, kwp: 0 };
        const ds = sitiosDe(s, e);
        const pr = prevision(s.fecha, e.etapa_id);
        return `<td class="par">${num(fmt.format(x.sitios), `${e.etiqueta} · ${s.etiqueta} ${s.fecha}`, ds, 'sitios')}${i ? delta(x.sitios, x0.sitios) : ''}${pr ? `<span class="vspron" title="Se había pronosticado ${fmt1.format(pr.sitios)}">pron. ${fmt1.format(pr.sitios)}</span>` : ''}</td><td>${num(fmt.format(x.kwp), `${e.etiqueta} · ${s.etiqueta} ${s.fecha} · kWp`, ds, 'sitios', { explica: `Suma de kWp de ${fmt.format(ds.length)} sitios en ${e.etiqueta} el ${s.fecha}: ${fmt1.format(x.kwp)} kWp`, ordenar: 'kwp' })}${i ? delta(x.kwp, x0.kwp) : ''}</td>`;
      }).join('')}${P.semanas.map(() => '<td class="par fut"></td><td class="fut"></td>').join('')}</tr>

          const n = P.meta.necesita.find(z => z.id === e.etapa_id);
          return `<td class="par fut">${n ? numMeta(fmt1.format(x.sitios), `${e.etiqueta} · lo que pide la meta`, n, P) : fmt1.format(x.sitios)}</td><td class="fut">${fmt.format(x.kwp)}</td>`; }).join('')}</tr>
        <tr class="esc-fc"><td class="esc">Forecast</td>${sem.map(() => '<td class="par"></td><td></td>').join('')}${P.semanas.map((f, i) => { const x = f.porEtapa[e.etapa_id] || { sitios: 0, kwp: 0 };

        <td class="par">${fmt.format(s.sitios)}${i ? delta(s.sitios, sem[0].sitios) : ''}</td>

      <tbody>${M.porTipo.map(r => `<tr>

        <td class="izq">${esc(r.equipo || '—')}</td>
        <td>${r.sla == null ? '<span class="pill mute">Por definir</span>' : marcaSupuesto(slaTxt(r.sla), r.firme)}</td>
        <td>${num(r.abiertos, `Abiertos · ${r.tipo}`, r.lAbiertos, 'tickets')}</td>
        <td>${r.vencidos ? `<span class="pill bad">${num(r.vencidos, `Vencidos · ${r.tipo}`, r.lVencidos, 'tickets')}</span>` : 0}</td>
        <td>${r.riesgo ? `<span class="pill warn">${num(r.riesgo, `En riesgo · ${r.tipo}`, r.lRiesgo, 'tickets')}</span>` : 0}</td>
        <td>${r.edadMediana == null ? '—' : num(fmt1.format(r.edadMediana), `Edad mediana · ${r.tipo}`, r.lAbiertos, 'tickets', opMediana(r.lAbiertos, r.edadMediana))}</td>
        <td>${num(r.creados28, `Entraron en 28 días · ${r.tipo}`, r.lCreados28, 'tickets')}</td><td>${num(r.cerrados28, `Salieron en 28 días · ${r.tipo}`, r.lCerrados28, 'tickets')}</td>
        <td>${num(pct(r.cumplimiento), `Cerrados con SLA · ${r.tipo}`, r.lConSla, 'tickets', opPct(r.lConSla, `cerrados de ${r.tipo}`))}</td>
        <td>${marcaSupuesto(num(fmt1.format(r.horasBacklog), `Horas en fila · ${r.tipo}`, r.lAbiertos, 'tickets', opHoras(r.lAbiertos, `abiertos de ${r.tipo}`)), r.firme)}</td></tr>`).join('')}</tbody>
    </table></div>`)}

    ${seccion('atrasados', 'Tickets más atrasados', 'atraso',
      vencidos.length ? `${vencidos.length} mostrados de ${fmt.format(R.vencidos)} vencidos` : 'ninguno fuera de SLA',
      fH,
      vencidos.length ? `<div class="tabla"><table>
      <thead><tr><th>Ticket</th><th class="izq">Tipo</th><th class="izq">Owner</th><th class="izq">Etapa</th><th>Edad ${info('edad')}</th><th>SLA ${info('sla')}</th><th>Atraso ${info('atraso')}</th><th>Estado</th></tr></thead>
      <tbody>${vencidos.map(t => `<tr><td>${hsTicket(t.ticket_id, t.ticket_id)}<br><small>${esc(t.asunto || '')}</small></td>
        <td class="izq">${esc(t.tipo)}</td><td class="izq">${esc(t.persona?.nombre || t.owner_id || 'Sin owner')}</td>
        <td class="izq">${esc(t.etapa_ticket)}</td><td>${t.edad} d</td><td>${slaTxt(t.sla)}</td>
        <td>${fmt1.format(t.edad - t.sla)} d</td><td>${pillSla(t)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="nota">No hay tickets fuera de SLA.</p>')}`;
}

function sparkline(puntos, capDia) {
  const w = 300, h = 44, max = Math.max(1, ...puntos);
  const x = i => i / (puntos.length - 1) * w, y = vv => h - 4 - vv / max * (h - 10);
  const d = puntos.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join('');
  const subeOBaja = puntos[puntos.length - 1] > puntos[0] ? 'var(--hs-red)' : 'var(--hs-ink)';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Horas en fila proyectadas: de ${fmt.format(puntos[0])} a ${fmt.format(puntos[puntos.length - 1])}">
    <line x1="0" x2="${w}" y1="${h - 4}" y2="${h - 4}" stroke="var(--hs-border)"/>
    <path d="${d}" fill="none" stroke="${subeOBaja}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function vistaCapacidad(M, raw) {
  const H = M.dias.length;
  const fuera = M.metricas.fuera.slice(0, 20);
  const fd = x => x === Infinity ? 'No se vacía' : fmt1.format(x);
  const fH = fuenteHubspot(raw);
  const fPer = fuenteManual(raw.personas, 'personas y jornada');
  const fCat = fuenteManual(raw.catalogo, 'esfuerzo del catálogo');
  const sat = M.equipos.filter(e => e.nivel === 'bad').length;
  const lim = M.equipos.filter(e => e.nivel === 'warn').length;

  return `
    ${seccion('saturacion', 'Saturación por equipo', 'saturacion',
      sat ? `${sat} ${sat === 1 ? 'equipo saturado' : 'equipos saturados'}${lim ? ` · ${lim} al límite` : ''}`
          : lim ? `${lim} al límite` : 'ningún equipo saturado',
      `${fH} · jornada: ${fPer} · ${fCat} · horizonte de ${H} días hábiles, hasta el ${esc(isoDay(M.dias[H - 1]))}`,
      `<div class="equipos">${M.equipos.map(e => `
      <article class="equipo ${e.nivel}">
        <h3><span>${esc(e.nombre)}</span><span class="pill ${e.nivel}">${e.sinDatos ? 'Sin esfuerzo definido' : e.nivel === 'bad' ? 'Saturado' : e.nivel === 'warn' ? 'Al límite' : 'Con espacio'}</span></h3>
        <div class="util ${e.nivel === 'bad' ? 'bad' : ''}">${e.sinDatos ? '—' : num(pct(e.util), `Utilización · ${e.nombre}`, e.abiertos, 'tickets', opUtil(e.abiertos, e.nombre, e.reqH, e.dispH))}</div>
        <div class="nota" style="margin:0">${num(fmt.format(e.reqH), `Horas requeridas · ${e.nombre}`, e.abiertos, 'tickets', opHoras(e.abiertos, `abiertos de ${e.nombre}`))} h requeridas de ${fmt.format(e.dispH)} h disponibles · ${num(e.backlogN, `Abiertos · ${e.nombre}`, e.abiertos, 'tickets')} abiertos${e.supuesto ? ' · <span class="supuesto">reparto supuesto</span>' : ''}</div>
        ${sparkline(e.proyeccion)}
        <div class="nota" style="margin:2px 0 0">${e.sinDatos ? 'Sin esfuerzo en el catálogo: no se puede proyectar' : e.diaVacio > 0 ? `La fila se vacía el ${isoDay(M.dias[e.diaVacio - 1])}` : e.backlogH === 0 ? 'Sin fila' : `Quedan ${fmt.format(e.proyeccion[e.proyeccion.length - 1])} h en fila al final del horizonte`}</div>
        ${e.alertas.length ? `<ul>${e.alertas.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
      </article>`).join('')}
    </div>
    ${M.sinPersona.length ? `<p class="aviso error">${num(M.sinPersona.length, 'Tickets con owner fuera de personas', M.sinPersona, 'tickets')} tickets abiertos tienen un owner que no está en la tabla de personas, así que no cuentan en ninguna capacidad. ${info('sinOwner')}</p>` : ''}`)}

    ${M.ticketsInactivos.length ? seccion('zombis', 'Tickets en deals inactivos', 'ticketsInactivos',
      `${num(M.ticketsInactivos.length, 'Tickets en deals inactivos', M.ticketsInactivos, 'tickets')} por cerrar`, fH,
      `<div class="tabla"><table>
        <thead><tr><th class="izq">Ticket</th><th class="izq">Tipo</th><th class="izq">Owner</th><th class="izq">Etapa del deal</th></tr></thead>
        <tbody>${M.ticketsInactivos.map(t => `<tr>
          <td class="izq">${hsTicket(t.ticket_id, t.asunto || t.ticket_id)}</td>
          <td class="izq">${esc(t.tipo || '—')}</td>
          <td class="izq">${esc(t.persona ? t.persona.nombre : (t.owner_id || 'sin owner'))}</td>
          <td class="izq">${esc(t.etapaDeal || '—')}</td></tr>`).join('')}</tbody>
      </table></div>`) : ''}

    ${(() => { const P = pronostico(M, ESTADO.sim);
      const O = olas(M, P);
      for (const o of O) o.quienesNombres = o.quienes.map(id => (M.personas.find(p => p.owner_id === id) || {}).nombre || id);
      return seccion('prepararse', 'Dónde prepararse', 'prepararse',
        O.length ? `${O.length} ${O.length === 1 ? 'ola' : 'olas'} · ${fmt.format(Math.round(sum(O, o => o.kwp)))} kWp en juego` : 'ninguna ola a la vista',
        `Pronóstico preliminar · ${P.semanas.length} semanas${simActivo() ? ' · con los cambios del simulador' : ''}`,
        O.length ? O.map(o => `<details class="cuello">
          <summary>${fraseOla(o)}</summary>
          <div class="tabla"><table>
            <thead><tr><th class="izq">Semana</th>${P.semanas.map((w, i) => `<th>${i + 1}S</th>`).join('')}</tr></thead>
            <tbody>
              <tr><td class="izq">Llegan a ${esc(o.cod)}</td>${P.semanas.map(w => { const t = w.traza[o.etapaId]; return `<td>${t ? fmt1.format(t.llegaron) : '—'}</td>`; }).join('')}</tr>
              <tr><td class="izq">Alcanza a sacar</td>${P.semanas.map(w => { const t = w.traza[o.etapaId]; const c = t && t.porque && t.porque.cuello; return `<td>${c ? fmt1.format(c.caben) : '—'}</td>`; }).join('')}</tr>
              <tr><td class="izq">Se acumulan</td>${P.semanas.map(w => { const t = w.traza[o.etapaId]; return `<td>${t ? fmt1.format(t.fin) : '—'}</td>`; }).join('')}</tr>
            </tbody></table></div>
          <p class="nota"><b>Quién lo trabaja:</b> ${o.sinCapacidad
              ? `nadie en la tabla de personas. Debería tomarlo ${esc(o.equipo)}, y mientras tanto el pronóstico lo hace avanzar por su SLA.`
              : `${o.quienesNombres.map(esc).join(', ')} <span class="supuesto">(${esc(o.quienFuente)})</span>. El paso que atora es «${esc(o.paso)}».`}</p>
          <p class="nota"><b>Sitios de la ola:</b> hoy hay ${fmt.format(o.sitiosOrigen)} en ${esc(o.origenCod || '—')} que vienen en camino.</p>
          ${o.desfase && o.desfase.length ? `<p class="nota"><b>Se salen de su mes:</b> ${num(o.desfase.length, `Sitios que se salen de su mes · ${o.cod}`, o.desfase.map(d => ({ ...d, etapaEtiqueta: o.etiqueta })), 'sitios')} sitios, ${fmt.format(Math.round(o.desfaseKwp))} kWp. ${info('desfase')}</p>` : ''}
        </details>`).join('') : '<p class="nota">Con el ritmo de hoy, ninguna etapa recibe más sitios de los que alcanza a sacar.</p>')
    ;})()}

    ${(() => { const P = pronostico(M, ESTADO.sim);
      const frase = c => c.primeraSemana == null
        ? (c.util[0] != null && c.util[0] > 0.85 ? 'al límite, no se satura en el horizonte' : `con espacio las ${P.semanas.length} semanas`)
        : c.primeraSemana === 1 ? 'saturado desde ya' : `se satura en ${c.primeraSemana}S`;
      const resumen = P.cuellos.filter(c => c.primeraSemana != null).length;
      return seccion('cuellos', 'Próximos cuellos de botella', 'cuellos',
        resumen ? `${resumen} de ${P.cuellos.length} equipos se saturan` : 'ningún equipo se satura',
        `Pronóstico preliminar · demanda de las colas contra la capacidad del equipo, ${P.semanas.length} semanas`,
        `${P.sinQuien && P.sinQuien.length ? `<p class="aviso">${P.sinQuien.length} pasos no tienen a nadie modelado que pueda tomarlos, así que avanzan <b>según su SLA</b> y están marcados «sin capacidad modelada»: ${P.sinQuien.map(esc).join(' · ')}. Esos pasos <b>no pueden mostrar saturación</b>: para que aparezcan, sus equipos tienen que estar en la tabla de personas.</p>` : ''}
        ${P.porSla && P.porSla.length ? `<p class="aviso">${P.porSla.length} pasos usan el SLA como duración porque no hay esfuerzo ni cierres suficientes: ${P.porSla.map(esc).join(', ')}. <b>Esas etapas no pueden mostrar saturación</b>, porque el SLA mide tiempo prometido y no horas de trabajo.</p>` : ''}
        ${P.modoEntrada === 'sin-historia' ? `<p class="aviso error">No hay dos fotos separadas por una semana, así que <b>no se puede medir el ritmo real de entrada</b>. El pronóstico usa el ritmo que haría falta para la meta (${fmt1.format(P.eMeta.sitios)} sitios por semana). No es el ritmo de hoy.</p>` : ''}
        <p class="fuente">${P.modoEntrada === 'meta'
            ? `Entran <b>${fmt1.format(P.eMeta.sitios)} sitios por semana</b>, los que harían falta para la meta de ${fmt.format(M.metricas.goal.sitios)} al mes despejando las conversiones (${pct(P.eMeta.conv)} sobrevive la cadena).`
            : P.eReal
              ? `Entran <b>${fmt1.format(P.eReal.sitios)} sitios por semana</b>, el ritmo real de las últimas ${P.eReal.intervalos} fotos.`
              : 'Ritmo de entrada no medible: ver el aviso de arriba.'}</p>
        ${P.sinEsfuerzo.length ? `<p class="aviso error">${P.sinEsfuerzo.length} colas no se pueden proyectar porque su ticket no tiene esfuerzo en el catálogo: ${P.sinEsfuerzo.map(esc).join(', ')}. Esas etapas quedan detenidas en el pronóstico.</p>` : ''}
        <p class="aviso">Pronóstico preliminar. El ritmo de cada etapa sale de la capacidad del equipo que cierra su ticket, o de los días del Reverse Eng Model. <b>No usa los tiempos por etapa de HubSpot</b>, que se mueven por lotes.</p>
        ${P.cuellos.map(c => `<details class="cuello">
          <summary><b>${esc(c.nombre)}</b>: ${frase(c)}</summary>
          <p class="nota">Capacidad ${fmt.format(c.cap)} h por semana. Colas que compiten: ${c.colas.join(', ')}.</p>
          <div class="tabla"><table>
            <thead><tr><th class="izq">Semana</th>${c.dem.map((_, i) => `<th>${i + 1}S</th>`).join('')}</tr></thead>
            <tbody>
              <tr><td class="izq">Demanda (h)</td>${c.dem.map(d => `<td>${fmt.format(d)}</td>`).join('')}</tr>
              <tr><td class="izq">Capacidad (h)</td>${c.dem.map(() => `<td>${fmt.format(c.cap)}</td>`).join('')}</tr>
              <tr><td class="izq">Utilización</td>${c.util.map(u => `<td>${u == null ? '—' : `<span class="pill ${u > 1 ? 'bad' : u > 0.85 ? 'warn' : 'ok'}">${pct(u)}</span>`}</td>`).join('')}</tr>
            </tbody></table></div>
          <p class="nota">Esfuerzo usado: ${c.esfuerzo.map(e => `${esc(e.ticket)} ${e.h == null ? '— sin dato' : fmt1.format(e.h) + ' h'} <span class="supuesto">(${e.fuente})</span>`).join(' · ')}</p>
        </details>`).join('')}`);
    })()}

    ${(() => { const P = pronostico(M, ESTADO.sim);
      const filas = Object.entries(P.meta.horasEquipo).map(([eq, h]) => ({ eq, pide: h, hay: P.capSemana[eq] || 0 }))
        .sort((a, b) => (b.pide - b.hay) - (a.pide - a.hay));
      const faltan = filas.filter(f => f.pide > f.hay).length;
      return seccion('pideMeta', 'Lo que pide la meta', 'pideMeta',
        faltan ? `${faltan} ${faltan === 1 ? 'equipo no alcanza' : 'equipos no alcanzan'}` : 'todos alcanzan',
        `Plan de ensueño · meta de ${fmt.format(P.metaMes)} sitios al mes · ${fmt1.format(P.meta.entradaSemana)} sitios deben entrar por semana`,
        `${(() => { const faltantes = filas.filter(f => f.pide > f.hay);
          return faltantes.length
            ? `<div class="aviso"><b>Brecha de capacidad, en horas.</b><ul style="margin:4px 0 0;padding-left:18px">${faltantes.slice(0, 5).map(f => `<li>Para la meta, <b>${esc(f.eq)}</b> necesita ${fmt.format(f.pide)} h por semana y tiene ${fmt.format(f.hay)}.</li>`).join('')}</ul></div>`
            : '<p class="nota">Con la meta actual, todos los equipos alcanzan en horas.</p>'; })()}
        <div class="tabla"><table>
          <thead><tr><th class="izq">Equipo</th><th>Pide la meta (h/sem)</th><th>Tiene (h/sem)</th><th>Diferencia</th></tr></thead>
          <tbody>${filas.map(f => `<tr>
            <td class="izq">${esc(f.eq)}</td>
            <td>${fmt.format(f.pide)}</td>
            <td>${fmt.format(f.hay)}</td>
            <td><span class="pill ${f.pide > f.hay ? 'bad' : 'ok'}">${f.hay - f.pide > 0 ? '+' : '−'}${fmt.format(Math.abs(f.hay - f.pide))} h</span></td></tr>`).join('')}</tbody>
        </table></div>
        <p class="nota">Horas por semana que exigiría instalar ${fmt1.format(P.metaMes / 4.33)} sitios por semana, si cada ticket se cumple en su SLA y sobreviven las tasas del Reverse Eng Model.</p>`);
    })()}

    ${seccion('personas', 'Por persona', null,
      `${M.personas.length} personas · ${M.personas.filter(p => p.util != null && p.util > 1).length} arriba del 100 %`,
      `${fH} · ${fPer} · ${fCat}`,
      `<div class="tabla"><table>
      <thead><tr><th>Persona</th><th class="izq">Equipo</th><th>Foco ${info('foco')}</th><th>Ausencias (h) ${info('ausencias')}</th><th>Disponibles (h) ${info('disponibles')}</th><th>Requeridas (h) ${info('requeridas')}</th><th>Utilización ${info('saturacion')}</th><th>Abiertos ${info('abiertos')}</th><th>Le caben ${info('leCaben')}</th><th>Días de cola ${info('diasCola')}</th><th>Días para vaciar ${info('diasVaciar')}</th></tr></thead>
      <tbody>${[...M.personas].sort((a, b) => (b.util ?? 0) - (a.util ?? 0)).map(p => `<tr>
        <td>${esc(p.nombre)}</td><td class="izq">${esc(p.equipo)}</td><td>${pct(p.foco)}</td>
        <td>${p.ausenciasH ? `<span class="pill">${fmt.format(p.ausenciasH)} h fuera</span>` : 0}</td>
        <td>${fmt.format(p.dispH)}</td><td>${num(fmt.format(p.reqH), `Horas requeridas · ${p.nombre}`, p.lAbiertos, 'tickets', opHoras(p.lAbiertos, `abiertos de ${p.nombre}`))}</td>
        <td><span class="pill ${p.util == null || (p.backlogN && p.sinEsfuerzo === p.backlogN) ? 'mute' : p.util > 1 ? 'bad' : p.util > 0.85 ? 'warn' : 'ok'}">${p.backlogN && p.sinEsfuerzo === p.backlogN ? 'Sin esfuerzo' : num(pct(p.util), `Utilización · ${p.nombre}`, p.lAbiertos, 'tickets', opUtil(p.lAbiertos, p.nombre, p.reqH, p.dispH))}</span></td>
        <td>${num(p.backlogN, `Abiertos · ${p.nombre}`, p.lAbiertos, 'tickets')}${p.sinEsfuerzo ? ` <small>(${p.sinEsfuerzo} sin esfuerzo)</small>` : ''}</td>
        <td>${p.ticketsQueCaben ?? '—'}</td><td>${fd(p.colaDias)}</td><td>${fd(p.diasVaciar)}</td></tr>`).join('')}</tbody>
    </table></div>`)}

    ${seccion('fuera', 'Sitios comprometidos que no entran en el forecast', 'fueraForecast',
      fuera.length ? `${fuera.length} de ${M.metricas.fuera.length}` : 'todos entran',
      fH,
      fuera.length ? `<div class="tabla"><table>
      <thead><tr><th>Sitio</th><th>kWp</th><th>Instalación</th><th>Días hábiles restantes ${info('diasRestantes')}</th><th class="izq">Por qué no entra ${info('porQue')}</th></tr></thead>
      <tbody>${fuera.map(r => `<tr><td>${hsDeal(r.deal.deal_id, r.deal.nombre)}</td><td>${fmt1.format(r.deal.kwp || 0)}</td><td>${esc(r.deal.fecha_instalacion)}</td><td>${r.diasRestantes}</td><td class="izq">${esc(r.motivo)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="nota">Todos los sitios comprometidos del mes entran en el forecast.</p>')}`;
}

  const meses = []; const base = new Date(HOY);
  for (let i = -2; i <= 3; i++) { const d = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + i, 1)); meses.push(isoDay(d.getTime()).slice(0, 7)); }
  const app = document.getElementById('app');
  document.getElementById('global-acciones').innerHTML = DEMO ? '' : '<button id="c-salir" type="button">Salir</button>';
  app.innerHTML = `
    <header class="top">
      <div><h1>Ticket System: capacidad y flujo</h1>

      <div class="controles">
        <label>Mes <select id="c-mes">${meses.map(m => { const [a, mm] = m.split('-'); return `<option value="${m}" ${m === ESTADO.mes ? 'selected' : ''}>${MESES[+mm - 1]} ${a}</option>`; }).join('')}</select></label>

        <span class="seg" role="group" aria-label="Unidad"><button type="button" data-uni="sitios" aria-pressed="${ESTADO.unidad === 'sitios'}">Sitios</button><button type="button" data-uni="kwp" aria-pressed="${ESTADO.unidad === 'kwp'}">kWp</button></span>
        <label>Horizonte <select id="c-hor">${[5, 10, 15, 20].map(n => `<option value="${n}" ${n === ESTADO.horizonte ? 'selected' : ''}>${n} días</option>`).join('')}</select></label>
      </div>
    </header>
    ${DEMO ? '<p class="aviso"><span class="badge-nuevo">Ejemplo</span>Estos son datos de ejemplo. Llena config.js con tu proyecto de Supabase para ver los datos reales.</p>' : ''}
    ${vistaMeta(M.metricas)}
    <div class="tabs" role="tablist">
      <button role="tab" id="t-flujo" aria-controls="p-flujo" aria-selected="${ESTADO.tab === 'flujo'}">Flujo y SLA</button>
      <button role="tab" id="t-cap" aria-controls="p-cap" aria-selected="${ESTADO.tab === 'cap'}">Capacidad y saturación</button>
    </div>
    <div class="sim ${ESTADO.simOn ? 'on' : ''}" id="sim">
      <strong style="font-size:13px">Simulador</strong>
      <label>Meta del mes <input type="number" id="s-meta" min="0" step="5" style="width:70px" value="${ESTADO.sim.meta ?? M.metricas.goal[ESTADO.unidad]}"></label>
      <label>Foco de todos <select id="s-foco">${[0.5,0.75,1,1.25,1.5].map(f => `<option value="${f}" ${ESTADO.sim.focoFactor === f ? 'selected' : ''}>${Math.round(f*100)} %</option>`).join('')}</select></label>
      <label>Esfuerzo <select id="s-esf">${[0.5,0.75,1,1.5,2].map(f => `<option value="${f}" ${ESTADO.sim.multEsfuerzo === f ? 'selected' : ''}>×${f}</option>`).join('')}</select></label>
      <label>+1 persona en <select id="s-extra"><option value="">—</option>${[...new Set((CFG.ritmoEtapas||[]).filter(r=>r.equipo).map(r=>r.equipo))].map(e => `<option value="${esc(e)}" ${ESTADO.sim.extraPersonas[e] ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></label>
      <label>Días de 2.01 <input type="number" id="s-d201" min="1" step="1" style="width:56px" value="${ESTADO.sim.diasEtapa['2.01'] ?? 9}"></label>
      <label>Entran sitios <select id="s-entrada"><option value="real" ${ESTADO.sim.entrada !== 'meta' ? 'selected' : ''}>al ritmo real</option><option value="meta" ${ESTADO.sim.entrada === 'meta' ? 'selected' : ''}>al ritmo de la meta</option></select></label>
      <button type="button" id="s-reset">Volver a lo real</button>
      ${ESTADO.simOn ? '<span class="pill warn">Simulando: los datos reales no cambian</span>' : ''}
    </div>
    <section class="panel" id="p-flujo" role="tabpanel" aria-labelledby="t-flujo" ${ESTADO.tab === 'flujo' ? '' : 'hidden'}>${vistaFlujo(M, raw)}</section>
    <section class="panel" id="p-cap" role="tabpanel" aria-labelledby="t-cap" ${ESTADO.tab === 'cap' ? '' : 'hidden'}>${vistaCapacidad(M, raw)}</section>
    <aside class="panel-det" id="panel-det" role="dialog" aria-modal="true" aria-labelledby="pd-t" hidden>
      <header><h2 id="pd-t"></h2><button type="button" id="pd-x">Cerrar</button></header>
      <p class="pd-n" id="pd-n"></p>
      <div id="pd-c"></div>
    </aside>`;

  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on('c-mes', 'change', e => { ESTADO.mes = e.target.value; recalcular(); });
  on('c-seg', 'change', e => { ESTADO.segmento = e.target.value; recalcular(); });
  app.querySelectorAll('[data-uni]').forEach(b => b.addEventListener('click', () => { ESTADO.unidad = b.dataset.uni; render(); }));
  on('c-hor', 'change', e => { ESTADO.horizonte = +e.target.value; recalcular(); });
  on('c-t0', 'change', e => { ESTADO.t0 = e.target.value; cargar(); });
  on('t-flujo', 'click', () => { ESTADO.tab = 'flujo'; render(); });
  on('t-cap', 'click', () => { ESTADO.tab = 'cap'; render(); });
  on('c-salir', 'click', async () => { await sb.auth.signOut(); location.reload(); });

  // Simulador: cambia solo ESTADO.sim, nunca los datos.
  const simCambio = () => { ESTADO.simOn = true; render(); };
  on('s-foco', 'change', e => { ESTADO.sim.focoFactor = Number(e.target.value); simCambio(); });
  on('s-esf', 'change', e => { ESTADO.sim.multEsfuerzo = Number(e.target.value); simCambio(); });
  on('s-meta', 'change', e => { ESTADO.sim.meta = Number(e.target.value) || null; simCambio(); });
  on('s-d201', 'change', e => { ESTADO.sim.diasEtapa['2.01'] = Number(e.target.value) || 9; simCambio(); });
  on('s-extra', 'change', e => { ESTADO.sim.extraPersonas = e.target.value ? { [e.target.value]: 1 } : {}; simCambio(); });
  on('s-entrada', 'change', e => { ESTADO.sim.entrada = e.target.value; simCambio(); });
  on('s-reset', 'click', () => { ESTADO.sim = { ...SIM0, extraPersonas: {}, diasEtapa: {} }; ESTADO.simOn = false; render(); });

  // Panel de detalle: abrir, cerrar con Esc o con el botón.
  app.querySelectorAll('.num').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); abrirDetalle(b.dataset.d, b);
  }));
  on('pd-x', 'click', cerrarDetalle);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarDetalle(); });

  // Secciones colapsables: el estado se recuerda por persona en localStorage.
  app.querySelectorAll('.sec-t').forEach(b => b.addEventListener('click', () => {
    const sec = b.closest('.sec').dataset.sec;
    const cuerpo = document.getElementById('sec-' + sec);
    const abrir = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', String(abrir));
    cuerpo.hidden = !abrir;
    if (abrir) ABIERTAS.add(sec); else ABIERTAS.delete(sec);
    guardarAbiertas();
  }));
  // El globo se ancla al lado que quepa, para que no se corte contra el borde.
  const anclar = b => {
    const r = b.getBoundingClientRect();
    b.classList.remove('anc-izq', 'anc-der');
    if (r.left < 140) b.classList.add('anc-izq');
    else if (window.innerWidth - r.right < 140) b.classList.add('anc-der');
  };
  // En celular no hay cursor: el ⓘ se abre al tocarlo y se cierra al tocar fuera.
  app.querySelectorAll('.info').forEach(b => {
    b.addEventListener('mouseenter', () => anclar(b));
    b.addEventListener('focus', () => anclar(b));
    b.addEventListener('click', e => {
      e.stopPropagation();
      anclar(b);
      const ya = b.classList.contains('abierto');
      app.querySelectorAll('.info.abierto').forEach(o => o.classList.remove('abierto'));
      if (!ya) b.classList.add('abierto');
    });
  });
  document.addEventListener('click', () => app.querySelectorAll('.info.abierto').forEach(o => o.classList.remove('abierto')), { once: false });
}

function recalcular() {
  ESTADO.modelo = construirModelo(ESTADO.raw, { horizonte: ESTADO.horizonte, mes: ESTADO.mes, segmento: ESTADO.segmento });
  render();
}

async function cargar() {
  const app = document.getElementById('app');
  try {
    if (DEMO) {
      ESTADO.raw = datosEjemplo();
      if (ESTADO.t0) { // en modo ejemplo, recorta la serie para simular otra línea base
        const i = ESTADO.raw.semanas.indexOf(ESTADO.t0);
        if (i > 0) ESTADO.raw.semanas = ESTADO.raw.semanas.slice(i);
      }
    } else {
      ESTADO.raw = await cargarSupabase(ESTADO.t0);
    }
    if (!ESTADO.segmento) {
      const segs = [...new Set(ESTADO.raw.etapas.map(e => e.pipeline))];
      ESTADO.segmento = segs.find(s => s.includes('Enterprise')) || segs[0] || null;
    }
    recalcular();
  } catch (err) {
    app.innerHTML = `<div class="acceso"><h1>No se pudieron cargar los datos</h1><p class="estado error">${esc(err.message)}</p></div>`;
  }
}

function vistaAcceso(mensaje, esError) {
  const dominio = CFG.dominioPermitido || 'niko.mx';
  document.getElementById('app').innerHTML = `
    <div class="acceso">
      <h1>Ticket System: capacidad y flujo</h1>
      <p class="nota">Entra con tu cuenta de Google de @${esc(dominio)}.</p>
      <button class="primario" type="button" id="b-google">Entrar con Google</button>
      <p class="estado${esError ? ' error' : ''}" id="estado-acceso">${mensaje ? esc(mensaje) : ''}</p>
    </div>`;
  document.getElementById('b-google').addEventListener('click', async () => {
    const estado = document.getElementById('estado-acceso');
    estado.className = 'estado';
    estado.textContent = 'Abriendo Google…';
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: location.origin + location.pathname,
        queryParams: { hd: dominio, prompt: 'select_account' },
      },
    });
    if (error) { estado.className = 'estado error'; estado.textContent = error.message; }
  });
}

// La sesión puede venir de cualquier cuenta de Google: RLS ya bloquea los datos,
// esto es para que la persona entienda por qué no ve nada.
async function sesionValida(session) {
  const dominio = CFG.dominioPermitido || 'niko.mx';
  const correo = (session && session.user && session.user.email || '').toLowerCase();
  if (correo.endsWith('@' + dominio)) return true;
  await sb.auth.signOut();
  vistaAcceso(correo
    ? `La cuenta ${correo} no es de @${dominio}. Cerramos la sesión: entra con tu cuenta de Niko.`
    : `Esa cuenta no es de @${dominio}. Entra con tu cuenta de Niko.`, true);
  return false;
}

async function iniciar() {
  if (DEMO) return cargar();
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  if (data.session) { if (await sesionValida(data.session)) return cargar(); }
  else vistaAcceso();
  sb.auth.onAuthStateChange(async (ev, session) => { if (session && await sesionValida(session)) cargar(); });
}

if (typeof document !== 'undefined') iniciar();
</script>
</body>
</html>
