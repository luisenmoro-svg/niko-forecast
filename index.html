<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket System: capacidad y flujo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Tokens del manual claro de Niko (Niko_Look_and_Feel.md) */
:root {
  color-scheme: light;
  --hs-bg: #F5F8FA; --hs-card: #FFFFFF; --hs-border: #DFE3EB;
  --hs-text: #111111; --hs-muted: #5F6B7A; --hs-ink: #000000;
  --hs-yellow: #E6FF00; --hs-yellow-tenue: #F7FFB3; --hs-gull: #96A3B5;
  --hs-red: #D92D20; --hs-red-bg: #FEF3F2;
  --hs-shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--hs-bg); color: var(--hs-text);
  font-family: 'Lexend', system-ui, sans-serif;
  font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums;
}
a { color: var(--hs-text); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--hs-ink); outline-offset: 2px; }

/* Encabezado global */
.global { position: sticky; top: 0; z-index: 10; background: var(--hs-card); border-bottom: 1px solid var(--hs-border); }
.global-in { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { font-weight: 700; font-size: 18px; color: var(--hs-ink); text-decoration: none; }
.marca span { font-weight: 400; font-size: 13px; color: var(--hs-muted); margin-left: 8px; }

.wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-weight: 600; font-size: 28px; line-height: 1.15; margin: 0; }
.meta-linea { color: var(--hs-muted); font-size: 12px; margin-top: 4px; }
.aviso { margin: 16px 0 0; padding: 8px 12px; border: 1px solid var(--hs-border); border-radius: 8px; background: var(--hs-card); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.aviso .badge-nuevo { background: var(--hs-yellow); color: var(--hs-ink); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.aviso.error { border-color: var(--hs-red); background: var(--hs-red-bg); }

/* Controles */
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--hs-muted); }
.controles label { display: inline-flex; align-items: center; gap: 6px; }
select, input[type=email], button {
  font: inherit; font-size: 13px; color: var(--hs-text); background: var(--hs-card);
  border: 1px solid var(--hs-border); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; transition: background-color .2s, color .2s; }
button.primario { background: var(--hs-ink); color: #fff; border-color: var(--hs-ink); }
.seg { display: inline-flex; border: 1px solid var(--hs-border); border-radius: 999px; overflow: hidden; background: var(--hs-card); }
.seg button { border: 0; border-radius: 0; padding: 5px 12px; }
.seg button[aria-pressed=true] { background: var(--hs-ink); color: #fff; }

/* Meta del mes */
.meta { margin-top: 20px; padding: 20px; background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 12px; box-shadow: var(--hs-shadow); }
.meta-cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cifra { border-left: 1px solid var(--hs-border); padding-left: 12px; }
.cifra:first-child { border-left: 0; padding-left: 0; }
.cifra .l { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.cifra .n { font-weight: 600; font-size: 28px; line-height: 1.15; margin-top: 4px; }
.cifra .s { color: var(--hs-muted); font-size: 12px; margin-top: 2px; }
.cifra.delta.neg .n { color: var(--hs-red); }
.mk { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
.mk.goal { background: none; border-left: 2px solid var(--hs-ink); border-radius: 0; width: 6px; }
.mk.fc { background: var(--hs-yellow); outline: 1px solid var(--hs-ink); outline-offset: -1px; }
.mk.re { background: var(--hs-ink); }
.barra { position: relative; height: 16px; margin: 20px 0 6px; background: var(--hs-bg); border: 1px solid var(--hs-border); border-radius: 8px; }
.barra .fc { position: absolute; inset: 0 auto 0 0; background: var(--hs-yellow); border-radius: 7px; }
.barra .re { position: absolute; inset: 0 auto 0 0; background: var(--hs-ink); border-radius: 7px 0 0 7px; }
.barra .gl { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--hs-ink); }
.barra .gl::after { content: 'Goal'; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; }
.barra-ejes { display: flex; justify-content: space-between; color: var(--hs-muted); font-size: 12px; }

/* Tablero de etapas */
.cadena { margin-top: 24px; }
.cadena-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 768px) { .cadena-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .cadena-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.etapa { display: flex; flex-direction: column; min-height: 104px; padding: 7px 9px 8px; background: var(--hs-card); border: 1px solid var(--hs-border); border-top: 3px solid transparent; border-radius: 8px; }
.etapa.inst { border-top-color: var(--hs-ink); }
.etapa .e { font-size: 13px; font-weight: 600; }
.etapa .tag { font-size: 10px; font-weight: 600; color: var(--hs-muted); }
.etapa .v { font-weight: 600; font-size: 18px; margin-top: 2px; line-height: 1.15; }
.etapa .k { color: var(--hs-muted); font-size: 12px; }
.etapa .pista { flex: 1; display: flex; align-items: flex-end; margin-top: 6px; min-height: 28px; }
.etapa .col { width: 100%; background: var(--hs-gull); border-radius: 4px 4px 0 0; min-height: 2px; }
.fuera-flujo { margin-top: 12px; padding: 10px 10px 2px; border: 1px dashed var(--hs-border); border-radius: 8px; }
.fuera-flujo .nota { margin: 0 0 8px; }
.fuera-flujo .etapa { min-height: 88px; }
.fuera-flujo .pista { min-height: 20px; }
table.t0 th.par, table.t0 td.par { border-left: 1px solid var(--hs-border); }
table.t0 th.sub { font-size: 11px; font-weight: 500; color: var(--hs-muted); }
.grupo { margin-top: 14px; }
.grupo:first-of-type { margin-top: 8px; }
.grupo-t { font-size: 13px; font-weight: 600; color: var(--hs-muted); margin-bottom: 6px; }
details.aviso.fuera > summary { cursor: pointer; font-weight: 600; }
details.aviso.fuera .tabla { margin-top: 10px; }
.etapa.inst .col { background: var(--hs-ink); }

/* Pestañas */
.tabs { display: flex; gap: 16px; margin-top: 32px; border-bottom: 1px solid var(--hs-border); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 2px; margin-bottom: -1px; font-size: 15px; font-weight: 500; color: var(--hs-muted); }
.tabs button:hover { color: var(--hs-text); }
.tabs button[aria-selected=true] { color: var(--hs-text); border-bottom-color: var(--hs-ink); font-weight: 600; }
section.panel { padding-top: 20px; }
section.panel[hidden] { display: none; }
h2 { font-weight: 600; font-size: 18px; margin: 28px 0 4px; }
h2:first-child { margin-top: 0; }
.nota { color: var(--hs-muted); font-size: 13px; margin: 0 0 12px; max-width: 80ch; }

.resumen { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 0 0 8px; }
.resumen div b { display: block; font-weight: 600; font-size: 24px; }
.resumen div span { color: var(--hs-muted); font-size: 12px; }

/* Tablas */
.tabla { overflow-x: auto; background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 8px; box-shadow: var(--hs-shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--hs-border); white-space: nowrap; }
th { font-size: 12px; font-weight: 500; color: var(--hs-muted); background: var(--hs-card); position: sticky; top: 0; }
th:first-child, td:first-child, td.izq, th.izq { text-align: left; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 600; border-top: 1px solid var(--hs-border); }
td small { color: var(--hs-muted); font-size: 12px; }
td:first-child small { display: block; }
.dif { font-size: 12px; color: var(--hs-muted); margin-left: 4px; }

/* Badges de estado: siempre con texto e icono, no solo color */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; border: 1px solid var(--hs-border); background: var(--hs-card); color: var(--hs-text); }
.pill.bad { background: var(--hs-red-bg); color: var(--hs-red); border-color: var(--hs-red); }
.pill.bad::before { content: '!'; display: inline-grid; place-items: center; width: 12px; height: 12px; border-radius: 50%; background: var(--hs-red); color: #fff; font-size: 9px; }
.pill.warn { border-style: dashed; border-color: var(--hs-ink); }
.pill.warn::before { content: '◐'; }
.pill.ok::before { content: '✓'; }
.pill.mute { color: var(--hs-muted); border-style: dashed; }
.supuesto { border-bottom: 1px dotted var(--hs-muted); cursor: help; }

/* Equipos */
.equipos { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .equipos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .equipos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.equipo { background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 8px; padding: 12px 16px; box-shadow: var(--hs-shadow); }
.equipo.bad { border-left: 4px solid var(--hs-red); }
.equipo.warn { border-style: dashed; border-color: var(--hs-ink); }
.equipo.mute { border-style: dashed; }
.equipo h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.equipo .util { font-weight: 600; font-size: 24px; line-height: 1.2; margin-top: 4px; }
.equipo .util.bad { color: var(--hs-red); }
.equipo ul { margin: 8px 0 0; padding-left: 16px; font-size: 12px; color: var(--hs-muted); }
.equipo svg { display: block; width: 100%; height: 44px; margin-top: 8px; }

/* Acceso */
.acceso { max-width: 512px; margin: 12vh auto 0; background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 12px; padding: 24px; box-shadow: var(--hs-shadow); }
.acceso h1 { font-size: 20px; }
.acceso .primario { margin-top: 16px; width: 100%; }
.estado { color: var(--hs-muted); font-size: 13px; margin-top: 12px; }
.error { color: var(--hs-red); }

@media (max-width: 720px) {
  .meta-cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cifra:nth-child(3) { border-left: 0; padding-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .barra .fc, .barra .re { transition: width .2s ease-out; }
  .tf-fade { animation: tf-fade .2s ease-out; }
  @keyframes tf-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>

<body>
<div class="global"><div class="global-in"><a class="marca" href="./">Niko<span>Ticket System</span></a><div id="global-acciones"></div></div></div>
<div class="wrap" id="app"><p class="estado">Cargando…</p></div>

<script>
'use strict';
// ====================== Configuración ======================
const CFG = (typeof window !== 'undefined' && window.NIKO_CONFIG) || {};
const DEMO = !CFG.supabaseUrl || CFG.supabaseUrl.includes('TU-PROYECTO');
const DAY = 864e5;
const fmt = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 0 });
const fmt1 = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 1 });
const pct = v => (v == null || !isFinite(v)) ? '—' : fmt.format(v * 100) + ' %';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (a, f = x => x) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const groupBy = (a, f) => a.reduce((m, x) => { const k = f(x); (m[k] ||= []).push(x); return m; }, {});
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// ====================== Días hábiles (hora CDMX) ======================
// Los días se representan como milisegundos UTC a medianoche.
function toDay(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return Date.parse(v + 'T00:00:00Z');
  const t = typeof v === 'number' ? v : Date.parse(v);
  if (isNaN(t)) return null;
  const d = new Date(t - 6 * 36e5);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
const isoDay = t => new Date(t).toISOString().slice(0, 10);
let FERIADOS = new Set();
function esHabil(t) { const w = new Date(t).getUTCDay(); return w !== 0 && w !== 6 && !FERIADOS.has(t); }
function habilesEntre(a, b) { // desde a (incluido) hasta b (excluido)
  if (a == null || b == null) return null;
  const [s, e] = a <= b ? [a, b] : [b, a];
  let n = 0; for (let t = s; t < e; t += DAY) if (esHabil(t)) n++;
  return a <= b ? n : -n;
}
function siguientesHabiles(desde, n) { const out = []; let t = desde; while (out.length < n) { if (esHabil(t)) out.push(t); t += DAY; } return out; }
const HOY = toDay(Date.now());

// ====================== Modelo ======================
// Recibe los datos crudos (de Supabase o de ejemplo) y calcula todo lo que muestra la página.
function construirModelo(raw, opciones) {
  const { horizonte, mes, segmento } = opciones;
  FERIADOS = new Set(raw.feriados.map(f => toDay(f.fecha)));

  const cat = {};
  for (const c of raw.catalogo) cat[c.tipo + '|' + c.segmento] = c;
  const buscarCat = (tipo, seg) => cat[tipo + '|' + seg] || raw.catalogo.find(c => c.tipo === tipo) || null;

  const personas = {};
  for (const p of raw.personas.filter(p => p.activo !== false)) personas[p.owner_id] = { ...p };
  const ausencia = {};
  for (const a of raw.ausencias) ausencia[a.owner_id + '|' + toDay(a.fecha)] = Number(a.horas) || 0;

  const hace28 = HOY - 28 * DAY;
  const habiles28 = Math.max(1, habilesEntre(hace28, HOY));

  // --- Tickets
  const tickets = raw.tickets.map(t0 => {
    const t = { ...t0 };
    const c = buscarCat(t.tipo, t.segmento);
    t.cat = c;
    t.sla = c && c.sla_dias != null ? Number(c.sla_dias) : null;
    t.d0 = toDay(t.creado); t.d1 = toDay(t.cerrado);
    t.abierto = t.d1 == null;
    t.edad = habilesEntre(t.d0, t.d1 ?? HOY);
    const enRevision = /review|revisi/i.test(t.etapa_ticket || '');
    const h = c ? (enRevision ? c.esfuerzo_rev_h : c.esfuerzo_prod_h) : null;
    const mult = c && c.unidad === 'sitio' ? Math.max(1, Number(t.sitios) || 1) : 1;
    t.horas = h == null || h === '' || isNaN(h) ? null : Number(h) * mult;
    t.firme = !!c && c.estado === 'firme';
    t.estadoSla = t.sla == null ? 'sin' : t.edad > t.sla ? 'vencido' : t.edad >= 0.8 * t.sla ? 'riesgo' : 'ok';
    t.creado28 = t.d0 != null && t.d0 >= hace28;
    t.cerrado28 = t.d1 != null && t.d1 >= hace28;
    t.persona = personas[t.owner_id] || null;
    return t;
  });
  // Etapas inactivas (Inviable, Dormant, Churned): ni sus deals ni sus tickets cuentan.
  const etapaPorId = Object.fromEntries(raw.etapas.map(e => [e.etapa_id, e]));
  const inactiva = id => !!(etapaPorId[id] && etapaPorId[id].es_inactivo);
  const etapaDeDeal = Object.fromEntries(raw.deals.map(d => [d.deal_id, d.etapa_id]));
  // Solo si TODOS sus deals estan en etapa inactiva: un ticket compartido sigue contando.
  const soloDealsInactivos = t => (t.deal_ids || []).length > 0
    && t.deal_ids.every(id => inactiva(etapaDeDeal[id]));

  const abiertosTodos = tickets.filter(t => t.abierto);
  const ticketsInactivos = abiertosTodos.filter(soloDealsInactivos).map(t => ({
    ...t,
    etapaDeal: (t.deal_ids || []).map(id => (etapaPorId[etapaDeDeal[id]] || {}).etiqueta)
      .filter(Boolean).join(', '),
  }));
  const abiertos = abiertosTodos.filter(t => !soloDealsInactivos(t));

  // --- Capacidad por persona en el horizonte
  const dias = siguientesHabiles(HOY, horizonte);
  const capDia = (p, d) => p.fte * p.foco * Math.max(0, p.jornada_h - (ausencia[p.owner_id + '|' + d] || 0));
  for (const p of Object.values(personas)) {
    const mios = tickets.filter(t => t.owner_id === p.owner_id);
    const misAbiertos = mios.filter(t => t.abierto);
    p.backlogN = misAbiertos.length;
    p.backlogH = sum(misAbiertos, t => t.horas);
    p.sinEsfuerzo = misAbiertos.filter(t => t.horas == null).length;
    p.entradaDiaH = sum(mios.filter(t => t.creado28), t => t.horas) / habiles28;
    p.entradaDiaN = mios.filter(t => t.creado28).length / habiles28;
    p.salidaDiaN = mios.filter(t => t.cerrado28).length / habiles28;
    p.capPorDia = dias.map(d => capDia(p, d));
    p.dispH = sum(p.capPorDia);
    p.reqH = p.backlogH + p.entradaDiaH * dias.length;
    p.util = p.dispH > 0 ? p.reqH / p.dispH : null;
    const capMedia = p.dispH / dias.length;
    p.colaDias = capMedia > 0 ? p.backlogH / capMedia : Infinity;
    const neto = capMedia - p.entradaDiaH;
    p.diasVaciar = p.backlogH === 0 ? 0 : neto > 0 ? p.backlogH / neto : Infinity;
    const conHoras = mios.filter(t => t.horas != null);
    p.esfuerzoMedio = conHoras.length ? sum(conHoras, t => t.horas) / conHoras.length : null;
    p.ticketsQueCaben = p.esfuerzoMedio ? Math.floor(p.dispH / p.esfuerzoMedio) : null;
    p.ausenciasH = sum(dias, d => ausencia[p.owner_id + '|' + d] || 0);
    let b = p.backlogH; p.proyeccion = [b];
    for (const c of p.capPorDia) { b = Math.max(0, b + p.entradaDiaH - c); p.proyeccion.push(b); }
  }

  // --- Equipos (saturación)
  const porEquipo = groupBy(Object.values(personas), p => p.equipo);
  const equipos = Object.entries(porEquipo).map(([nombre, ps]) => {
    const e = { nombre, personas: ps };
    e.dispH = sum(ps, p => p.dispH);
    e.reqH = sum(ps, p => p.reqH);
    e.backlogH = sum(ps, p => p.backlogH);
    e.backlogN = sum(ps, p => p.backlogN);
    e.sinEsfuerzo = sum(ps, p => p.sinEsfuerzo);
    e.util = e.dispH > 0 ? e.reqH / e.dispH : null;
    e.entradaSem = sum(ps, p => p.entradaDiaN) * 5;
    e.salidaSem = sum(ps, p => p.salidaDiaN) * 5;
    e.proyeccion = dias.map((_, i) => sum(ps, p => p.proyeccion[i + 1])); e.proyeccion.unshift(e.backlogH);
    const top = [...ps].sort((a, b) => b.backlogN - a.backlogN)[0];
    e.concentracion = e.backlogN ? top.backlogN / e.backlogN : 0;
    e.top = top;
    e.diaVacio = e.proyeccion.findIndex((v, i) => i > 0 && v === 0);
    e.alertas = [];
    if (e.util == null) e.alertas.push('Sin horas disponibles en el horizonte');
    else if (e.util > 1) e.alertas.push(`Faltan ${fmt.format(e.reqH - e.dispH)} h en ${dias.length} días hábiles`);
    if (e.entradaSem > e.salidaSem * 1.1 && e.entradaSem >= 1) e.alertas.push(`La fila crece: entran ${fmt1.format(e.entradaSem)} y salen ${fmt1.format(e.salidaSem)} por semana`);
    if (e.concentracion >= 0.7 && e.backlogN >= 5 && ps.length > 1) e.alertas.push(`${top.nombre} tiene ${pct(e.concentracion)} de los abiertos`);
    if (ps.length === 1 && e.backlogN >= 5) e.alertas.push(`Depende de una sola persona (${top.nombre})`);
    if (e.sinEsfuerzo) e.alertas.push(`${e.sinEsfuerzo} abiertos sin esfuerzo en el catálogo: la carga real es mayor`);
    e.sinDatos = e.backlogN > 0 && e.sinEsfuerzo === e.backlogN;
    e.nivel = e.sinDatos ? 'mute' : e.util == null || e.util > 1 ? 'bad' : e.util > 0.85 || e.alertas.length > 1 ? 'warn' : 'ok';
    return e;
  }).sort((a, b) => (b.util ?? 99) - (a.util ?? 99));
  const sinPersona = abiertos.filter(t => !t.persona);

  // --- Etapas y deals
  const etapas = raw.etapas.filter(e => (!segmento || e.pipeline === segmento) && !e.es_inactivo).sort((a, b) => a.orden - b.orden);
  const deals = raw.deals.filter(d => (!segmento || d.segmento === segmento) && !inactiva(d.etapa_id));
  const esInstalado = d => !!(etapaPorId[d.etapa_id] && etapaPorId[d.etapa_id].es_instalado);

  const porEtapa = etapas.map(e => {
    const ds = deals.filter(d => d.etapa_id === e.etapa_id);
    return { ...e, sitios: ds.length, kwp: sum(ds, d => d.kwp) };
  });

  // Evolución semanal: T0, 1S, 2S…
  const series = raw.series.filter(r => (!segmento || r.segmento === segmento) && !inactiva(r.etapa_id));
  const semanas = raw.semanas.map((fecha, i) => {
    const filas = series.filter(r => r.snapshot_date === fecha);
    const pe = {};
    for (const e of etapas) { const ds = filas.filter(r => r.etapa_id === e.etapa_id); pe[e.etapa_id] = { sitios: ds.length, kwp: sum(ds, d => d.kwp) }; }
    return { fecha, etiqueta: i === 0 ? 'T0' : `${i}S`, porEtapa: pe, sitios: sum(Object.values(pe), x => x.sitios), kwp: sum(Object.values(pe), x => x.kwp) };
  });

  // --- Goal, forecast y real del mes
  const [anio, m] = mes.split('-').map(Number);
  const iniMes = Date.UTC(anio, m - 1, 1), finMes = Date.UTC(anio, m, 1);
  const metaRow = raw.metas.find(x => toDay(x.mes) === iniMes);
  const goal = metaRow ? { sitios: +metaRow.sitios, kwp: +metaRow.kwp } : (CFG.metaPorDefecto || { sitios: 80, kwp: 1200 });
  const comprometidos = deals.filter(d => { const f = toDay(d.fecha_instalacion); return f != null && f >= iniMes && f < finMes; });
  const ticketsPorDeal = {};
  for (const t of abiertos) for (const id of (t.deal_ids || [])) (ticketsPorDeal[id] ||= []).push(t);

  const evaluados = comprometidos.map(d => {
    const r = { deal: d, instalado: esInstalado(d) };
    const fecha = toDay(d.fecha_instalacion);
    r.diasRestantes = habilesEntre(HOY, fecha);
    if (r.instalado) { r.enForecast = true; r.motivo = 'Instalado'; return r; }
    const ts = ticketsPorDeal[d.deal_id] || [];
    if (!ts.length) { r.enForecast = r.diasRestantes >= 0; r.motivo = r.enForecast ? 'Sin tickets abiertos' : 'La fecha ya pasó y no está instalado'; r.supuesto = true; return r; }
    let peor = null;
    for (const t of ts) {
      const cola = t.persona ? t.persona.colaDias : Infinity;
      const restanteSla = Math.max(0, (t.sla ?? 0) - t.edad);
      const demora = cola + restanteSla;
      if (!peor || demora > peor.demora) peor = { t, demora, cola };
    }
    r.demora = peor.demora; r.cuello = peor.t;
    r.enForecast = peor.demora <= r.diasRestantes;
    r.motivo = !peor.t.persona ? `Owner fuera del modelo en ${peor.t.tipo}`
      : r.enForecast ? 'A tiempo con la capacidad actual'
      : `${peor.t.persona.equipo} (${peor.t.persona.nombre}): necesita ${fmt1.format(peor.demora)} días hábiles entre fila y SLA, y quedan ${r.diasRestantes}`;
    return r;
  });
  const enF = evaluados.filter(r => r.enForecast), reales = evaluados.filter(r => r.instalado);
  const metricas = {
    goal,
    plan: { sitios: comprometidos.length, kwp: sum(comprometidos, d => d.kwp) },
    forecast: { sitios: enF.length, kwp: sum(enF, r => r.deal.kwp) },
    real: { sitios: reales.length, kwp: sum(reales, r => r.deal.kwp) },
    fuera: evaluados.filter(r => !r.enForecast).sort((a, b) => (b.demora ?? 0) - (a.demora ?? 0)),
  };

  // --- Resumen de tickets por tipo
  const porTipo = Object.values(groupBy(tickets, t => t.tipo + '|' + (t.segmento || ''))).map(ts => {
    const ab = ts.filter(t => t.abierto), cer = ts.filter(t => t.cerrado28);
    const conSla = cer.filter(t => t.sla != null);
    return {
      tipo: ts[0].tipo, segmento: ts[0].segmento, equipo: ts[0].equipo, sla: ts[0].sla, firme: ts[0].firme,
      abiertos: ab.length,
      vencidos: ab.filter(t => t.estadoSla === 'vencido').length,
      riesgo: ab.filter(t => t.estadoSla === 'riesgo').length,
      edadMediana: median(ab.map(t => t.edad)),
      creados28: ts.filter(t => t.creado28).length, cerrados28: cer.length,
      cumplimiento: conSla.length ? conSla.filter(t => t.edad <= t.sla).length / conSla.length : null,
      horasBacklog: sum(ab, t => t.horas),
    };
  }).sort((a, b) => b.abiertos - a.abiertos);

  const cerrados28 = tickets.filter(t => t.cerrado28 && t.sla != null);
  return {
    tickets, abiertos, personas: Object.values(personas), equipos, sinPersona, ticketsInactivos, dias,
    porEtapa, semanas, metricas, porTipo,
    resumen: {
      abiertos: abiertos.length,
      vencidos: abiertos.filter(t => t.estadoSla === 'vencido').length,
      riesgo: abiertos.filter(t => t.estadoSla === 'riesgo').length,
      sinSla: abiertos.filter(t => t.estadoSla === 'sin').length,
      cumplimiento: cerrados28.length ? cerrados28.filter(t => t.edad <= t.sla).length / cerrados28.length : null,
      sitiosT0: semanas[0]?.sitios ?? 0, kwpT0: semanas[0]?.kwp ?? 0,
    },
  };
}

let sb = null;
async function traerTodo(tabla, columnas, filtro) {
  const out = [];
  for (let desde = 0; ; desde += 1000) {
    let q = sb.from(tabla).select(columnas).range(desde, desde + 999);
    if (filtro) q = filtro(q);
    const { data, error } = await q;
    if (error) throw new Error(`${tabla}: ${error.message}`);
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
function elegirSemanas(fechas, t0) {
  const ordenadas = [...fechas].sort();
  const inicio = t0 && ordenadas.includes(t0) ? t0 : ordenadas[0];
  const posteriores = ordenadas.filter(f => f >= inicio);
  const out = [inicio];
  let objetivo = toDay(inicio);
  // un punto cada 5 días hábiles: la última foto disponible antes de cada corte
  for (;;) {
    let n = 0; let t = objetivo;
    while (n < 5) { t += DAY; if (esHabil(t)) n++; }
    objetivo = t;
    const candidata = posteriores.filter(f => toDay(f) <= objetivo).pop();
    if (toDay(posteriores[posteriores.length - 1]) < objetivo) break;
    if (candidata && candidata !== out[out.length - 1]) out.push(candidata);
  }
  const ultima = posteriores[posteriores.length - 1];
  if (ultima && ultima !== out[out.length - 1]) out.push(ultima);
  return out;
}
async function cargarSupabase(t0) {
  const [catalogo, personas, ausencias, feriados, metas, etapas, snaps] = await Promise.all([
    traerTodo('catalogo', '*'), traerTodo('personas', '*'),
    traerTodo('ausencias', '*', q => q.gte('fecha', isoDay(HOY))),
    traerTodo('feriados', '*'), traerTodo('metas', '*'), traerTodo('etapas_deal', '*'),
    traerTodo('snapshots', 'snapshot_date', q => q.order('snapshot_date')),
  ]);
  if (!snaps.length) throw new Error('Todavía no hay fotos de HubSpot. Corre el workflow «Foto de HubSpot» en GitHub Actions.');
  FERIADOS = new Set(feriados.map(f => toDay(f.fecha)));
  const fechas = snaps.map(s => s.snapshot_date);
  const ultima = fechas[fechas.length - 1];
  const semanas = elegirSemanas(fechas, t0);
  const [deals, tickets, series] = await Promise.all([
    traerTodo('deals_snapshot', '*', q => q.eq('snapshot_date', ultima)),
    traerTodo('tickets_snapshot', '*', q => q.eq('snapshot_date', ultima)),
    traerTodo('deals_snapshot', 'snapshot_date,deal_id,etapa_id,kwp,segmento', q => q.in('snapshot_date', semanas)),
  ]);
  return { catalogo, personas, ausencias, feriados, metas, etapas, deals, tickets, series, semanas, fechas, ultima };
}

function v(x) { return ESTADO.unidad === 'sitios' ? fmt.format(x.sitios) : fmt.format(x.kwp); }
function u(n) { return ESTADO.unidad === 'sitios' ? (n === 1 ? 'sitio' : 'sitios') : 'kWp'; }

function vistaMeta(M) {

}

function vistaCadena(etapas) {
  const k = ESTADO.unidad;
  // Las etapas de post-instalación salen de config.js: acumulan histórico y, en la
  // misma escala, aplastan la cadena. Se muestran aparte, como ruta fuera del flujo.
  const post = new Set(CFG.etapasPostInstalacion || []);
  const cadena = etapas.filter(e => !post.has(e.etapa_id));
  const fuera = etapas.filter(e => post.has(e.etapa_id));

  // Una fila por sección del pipeline, cada una con su propia escala.
  const grupos = (CFG.gruposEtapas || []).map(g => ({
    titulo: g.titulo,
    etapas: cadena.filter(e => (g.etapas || []).includes(e.etapa_id)),
  }));
  const asignadas = new Set(grupos.flatMap(g => g.etapas.map(e => e.etapa_id)));
  const sueltas = cadena.filter(e => !asignadas.has(e.etapa_id));
  // Una etapa sin grupo nunca se esconde: cae en «Otras».
  if (sueltas.length) grupos.push({ titulo: 'Otras', etapas: sueltas });
  const filas = grupos.filter(g => g.etapas.length);

  const columna = (e, maximo, alto) => `
      <div class="etapa ${e.es_instalado ? 'inst' : ''}" title="${esc(e.etiqueta)}: ${nSitios(e.sitios)}, ${fmt1.format(e.kwp)} kWp">
        <div class="e">${esc(e.etiqueta)}</div>
        <div class="v">${k === 'sitios' ? e.sitios : fmt.format(e.kwp)}</div>
        <div class="k">${k === 'sitios' ? fmt.format(e.kwp) + ' kWp' : nSitios(e.sitios)}</div>
        <div class="pista"><div class="col" style="height:${Math.round(e[k] / maximo * alto)}px"></div></div>
      </div>`;
  const fila = (g, alto) => {
    const max = Math.max(1, ...g.etapas.map(e => e[k]));
    return `<div class="grupo">
      <div class="grupo-t">${esc(g.titulo)}</div>
      <div class="cadena-grid">${g.etapas.map(e => columna(e, max, alto)).join('')}</div>
    </div>`;
  };
  const maxFuera = Math.max(1, ...fuera.map(e => e[k]));
  return `<div class="cadena"><h2>Dónde están hoy los sitios</h2>
    <p class="nota">Sitios y kWp en cada etapa del deal, de la foto más reciente. Cada sección tiene su propia escala, así que las alturas solo se comparan dentro de una fila.</p>
    ${filas.map(g => fila(g, 28)).join('')}
    ${fuera.length ? `<div class="fuera-flujo">
      <div class="grupo-t">Post-instalación</div>
      <p class="nota">Ya instalados, con su propia escala. Cuentan en Real, no en la cadena.</p>
      <div class="cadena-grid">${fuera.map(e => columna(e, maxFuera, 20)).join('')}</div>
    </div>` : ''}
  </div>`;
}

      <div><b>${fmt.format(R.abiertos)}</b><span>tickets abiertos</span></div>
      <div><b>${fmt.format(R.vencidos)}</b><span>fuera de SLA</span></div>
      <div><b>${fmt.format(R.riesgo)}</b><span>en riesgo (80 % del SLA)</span></div>
      <div><b>${pct(R.cumplimiento)}</b><span>cerrados a tiempo, últimos 28 días</span></div>
      <div><b>${fmt.format(R.sitiosT0)} · ${fmt.format(R.kwpT0)}</b><span>sitios y kWp en T0 (${esc(sem[0]?.fecha || '—')})</span></div>
    </div>

    <h2>Qué cambió desde T0</h2>
    <p class="nota">Cada columna es una foto semanal, con sitios y kWp lado a lado. El número pequeño es la diferencia contra T0. Elige otra fecha de T0 arriba para mover la línea base.</p>
    <div class="tabla"><table class="t0">
      <thead>
        <tr><th rowspan="2">Etapa</th>${sem.map(s => `<th colspan="2" class="par" title="${s.fecha}">${s.etiqueta} <small>${s.fecha.slice(5)}</small></th>`).join('')}</tr>
        <tr>${sem.map(() => '<th class="sub par">Sitios</th><th class="sub">kWp</th>').join('')}</tr>
      </thead>
      <tbody>${etapas.map(e => `<tr><td>${esc(e.etiqueta)}</td>${sem.map((s, i) => {
        const x = s.porEtapa[e.etapa_id] || { sitios: 0, kwp: 0 }, x0 = sem[0].porEtapa[e.etapa_id] || { sitios: 0, kwp: 0 };
        return `<td class="par">${fmt.format(x.sitios)}${i ? delta(x.sitios, x0.sitios) : ''}</td><td>${fmt.format(x.kwp)}${i ? delta(x.kwp, x0.kwp) : ''}</td>`;
      }).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td>${sem.map((s, i) => `
        <td class="par">${fmt.format(s.sitios)}${i ? delta(s.sitios, sem[0].sitios) : ''}</td>
        <td>${fmt.format(s.kwp)}${i ? delta(s.kwp, sem[0].kwp) : ''}</td>`).join('')}</tr></tfoot>
    </table></div>

    <h2>Volumen y SLA por tipo de ticket</h2>
    <p class="nota">Edad en días hábiles desde la creación. Los valores subrayados con puntos vienen de filas del catálogo que todavía no están firmadas.</p>
    <div class="tabla"><table>
      <thead><tr><th>Tipo</th><th class="izq">Equipo</th><th>SLA</th><th>Abiertos</th><th>Vencidos</th><th>En riesgo</th><th>Edad mediana</th><th>Entraron 28 d</th><th>Salieron 28 d</th><th>A tiempo</th><th>Horas en fila</th></tr></thead>
      <tbody>${M.porTipo.map(r => `<tr>
        <td>${esc(r.tipo || 'Sin tipo')}<br><small>${esc(r.segmento || 'sin segmento')}</small></td>
        <td class="izq">${esc(r.equipo || '—')}</td>
        <td>${r.sla == null ? '<span class="pill mute">Por definir</span>' : marcaSupuesto(slaTxt(r.sla), r.firme)}</td>
        <td>${r.abiertos}</td>
        <td>${r.vencidos ? `<span class="pill bad">${r.vencidos}</span>` : 0}</td>
        <td>${r.riesgo ? `<span class="pill warn">${r.riesgo}</span>` : 0}</td>
        <td>${r.edadMediana == null ? '—' : fmt1.format(r.edadMediana)}</td>
        <td>${r.creados28}</td><td>${r.cerrados28}</td>
        <td>${pct(r.cumplimiento)}</td>
        <td>${marcaSupuesto(fmt1.format(r.horasBacklog), r.firme)}</td></tr>`).join('')}</tbody>
    </table></div>

    <h2>Tickets más atrasados</h2>
    <p class="nota">Los 25 abiertos con más días por encima de su SLA.</p>
    ${vencidos.length ? `<div class="tabla"><table>
      <thead><tr><th>Ticket</th><th class="izq">Tipo</th><th class="izq">Owner</th><th class="izq">Etapa</th><th>Edad</th><th>SLA</th><th>Atraso</th><th>Estado</th></tr></thead>
      <tbody>${vencidos.map(t => `<tr><td>${link(t.ticket_id)}<br><small>${esc(t.asunto || '')}</small></td>
        <td class="izq">${esc(t.tipo)}</td><td class="izq">${esc(t.persona?.nombre || t.owner_id || 'Sin owner')}</td>
        <td class="izq">${esc(t.etapa_ticket)}</td><td>${t.edad} d</td><td>${slaTxt(t.sla)}</td>
        <td>${fmt1.format(t.edad - t.sla)} d</td><td>${pillSla(t)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="nota">No hay tickets fuera de SLA.</p>'}`;
}

function sparkline(puntos, capDia) {
  const w = 300, h = 44, max = Math.max(1, ...puntos);
  const x = i => i / (puntos.length - 1) * w, y = vv => h - 4 - vv / max * (h - 10);
  const d = puntos.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join('');
  const subeOBaja = puntos[puntos.length - 1] > puntos[0] ? 'var(--hs-red)' : 'var(--hs-ink)';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Horas en fila proyectadas: de ${fmt.format(puntos[0])} a ${fmt.format(puntos[puntos.length - 1])}">
    <line x1="0" x2="${w}" y1="${h - 4}" y2="${h - 4}" stroke="var(--hs-border)"/>
    <path d="${d}" fill="none" stroke="${subeOBaja}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function vistaCapacidad(M) {
  const H = M.dias.length;
  const fuera = M.metricas.fuera.slice(0, 20);
  const fd = x => x === Infinity ? 'No se vacía' : fmt1.format(x);
  return `
    <p class="nota">Horas disponibles = FTE × % de foco × (jornada − ausencias), día por día durante los próximos ${H} días hábiles (hasta el ${isoDay(M.dias[H - 1])}). Horas requeridas = fila abierta + lo que entra al ritmo de los últimos 28 días. La carga se asigna al owner real de HubSpot.</p>

    <h2>Saturación por equipo</h2>
    <div class="equipos">${M.equipos.map(e => `
      <article class="equipo ${e.nivel}">
        <h3><span>${esc(e.nombre)}</span><span class="pill ${e.nivel}">${e.sinDatos ? 'Sin esfuerzo definido' : e.nivel === 'bad' ? 'Saturado' : e.nivel === 'warn' ? 'Al límite' : 'Con espacio'}</span></h3>
        <div class="util ${e.nivel === 'bad' ? 'bad' : ''}">${e.sinDatos ? '—' : pct(e.util)}</div>
        <div class="nota" style="margin:0">${fmt.format(e.reqH)} h requeridas de ${fmt.format(e.dispH)} h disponibles · ${e.backlogN} abiertos</div>
        ${sparkline(e.proyeccion)}
        <div class="nota" style="margin:2px 0 0">${e.sinDatos ? 'Sin esfuerzo en el catálogo: no se puede proyectar' : e.diaVacio > 0 ? `La fila se vacía el ${isoDay(M.dias[e.diaVacio - 1])}` : e.backlogH === 0 ? 'Sin fila' : `Quedan ${fmt.format(e.proyeccion[e.proyeccion.length - 1])} h en fila al final del horizonte`}</div>
        ${e.alertas.length ? `<ul>${e.alertas.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
      </article>`).join('')}
    </div>
    ${M.sinPersona.length ? `<p class="aviso error">${M.sinPersona.length} tickets abiertos tienen un owner que no está en la tabla de personas, así que no cuentan en ninguna capacidad. Agrégalos en Supabase &gt; personas.</p>` : ''}
    ${M.ticketsInactivos.length ? `<details class="aviso fuera">
      <summary>${M.ticketsInactivos.length} tickets abiertos cuelgan de deals en etapa inactiva. No cuentan en la capacidad: conviene cerrarlos.</summary>
      <div class="tabla"><table>
        <thead><tr><th class="izq">Ticket</th><th class="izq">Tipo</th><th class="izq">Owner</th><th class="izq">Etapa del deal</th></tr></thead>
        <tbody>${M.ticketsInactivos.map(t => `<tr>
          <td class="izq">${esc(t.asunto || t.ticket_id)}</td>
          <td class="izq">${esc(t.tipo || '—')}</td>
          <td class="izq">${esc(t.persona ? t.persona.nombre : (t.owner_id || 'sin owner'))}</td>
          <td class="izq">${esc(t.etapaDeal || '—')}</td></tr>`).join('')}</tbody>
      </table></div>
    </details>` : ''}

    <h2>Por persona</h2>
    <div class="tabla"><table>
      <thead><tr><th>Persona</th><th class="izq">Equipo</th><th>Foco</th><th>Ausencias (h)</th><th>Disponibles (h)</th><th>Requeridas (h)</th><th>Utilización</th><th>Abiertos</th><th>Le caben</th><th>Días de cola</th><th>Días para vaciar</th></tr></thead>
      <tbody>${[...M.personas].sort((a, b) => (b.util ?? 0) - (a.util ?? 0)).map(p => `<tr>
        <td>${esc(p.nombre)}</td><td class="izq">${esc(p.equipo)}</td><td>${pct(p.foco)}</td>
        <td>${p.ausenciasH ? `<span class="pill" title="Horas fuera en el horizonte">${fmt.format(p.ausenciasH)} h fuera</span>` : 0}</td>
        <td>${fmt.format(p.dispH)}</td><td>${fmt.format(p.reqH)}</td>
        <td><span class="pill ${p.util == null || (p.backlogN && p.sinEsfuerzo === p.backlogN) ? 'mute' : p.util > 1 ? 'bad' : p.util > 0.85 ? 'warn' : 'ok'}">${p.backlogN && p.sinEsfuerzo === p.backlogN ? 'Sin esfuerzo' : pct(p.util)}</span></td>
        <td>${p.backlogN}${p.sinEsfuerzo ? ` <small title="sin esfuerzo en el catálogo">(${p.sinEsfuerzo} sin esfuerzo)</small>` : ''}</td>
        <td>${p.ticketsQueCaben ?? '—'}</td><td>${fd(p.colaDias)}</td><td>${fd(p.diasVaciar)}</td></tr>`).join('')}</tbody>
    </table></div>

    <h2>Sitios comprometidos que no entran en el forecast</h2>
    <p class="nota">Sitios con fecha de instalación este mes cuya cola más lenta (días de fila del owner + SLA restante del ticket) es mayor que los días hábiles que faltan para instalar.</p>
    ${fuera.length ? `<div class="tabla"><table>
      <thead><tr><th>Sitio</th><th>kWp</th><th>Instalación</th><th>Días hábiles restantes</th><th class="izq">Por qué no entra</th></tr></thead>
      <tbody>${fuera.map(r => `<tr><td>${esc(r.deal.nombre)}</td><td>${fmt1.format(r.deal.kwp || 0)}</td><td>${esc(r.deal.fecha_instalacion)}</td><td>${r.diasRestantes}</td><td class="izq">${esc(r.motivo)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="nota">Todos los sitios comprometidos del mes entran en el forecast.</p>'}`;
}

function render() {
  const M = ESTADO.modelo, raw = ESTADO.raw;
  const segmentos = [...new Set(raw.etapas.map(e => e.pipeline))].filter(Boolean);
  const meses = []; const base = new Date(HOY);
  for (let i = -2; i <= 3; i++) { const d = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + i, 1)); meses.push(isoDay(d.getTime()).slice(0, 7)); }
  const app = document.getElementById('app');
  document.getElementById('global-acciones').innerHTML = DEMO ? '' : '<button id="c-salir" type="button">Salir</button>';
  app.innerHTML = `
    <header class="top">
      <div><h1>Ticket System: capacidad y flujo</h1>
        <div class="meta-linea">Foto de HubSpot del ${esc(raw.ultima)}</div></div>
      <div class="controles">
        <label>Mes <select id="c-mes">${meses.map(m => { const [a, mm] = m.split('-'); return `<option value="${m}" ${m === ESTADO.mes ? 'selected' : ''}>${MESES[+mm - 1]} ${a}</option>`; }).join('')}</select></label>
        <label>Segmento <select id="c-seg">${segmentos.map(s => `<option ${s === ESTADO.segmento ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
        <label>T0 <select id="c-t0">${raw.fechas.map(f => `<option ${f === raw.semanas[0] ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
        <span class="seg" role="group" aria-label="Unidad"><button type="button" data-uni="sitios" aria-pressed="${ESTADO.unidad === 'sitios'}">Sitios</button><button type="button" data-uni="kwp" aria-pressed="${ESTADO.unidad === 'kwp'}">kWp</button></span>
        <label>Horizonte <select id="c-hor">${[5, 10, 15, 20].map(n => `<option value="${n}" ${n === ESTADO.horizonte ? 'selected' : ''}>${n} días</option>`).join('')}</select></label>
      </div>
    </header>
    ${DEMO ? '<p class="aviso"><span class="badge-nuevo">Ejemplo</span>Estos son datos de ejemplo. Llena config.js con tu proyecto de Supabase para ver los datos reales.</p>' : ''}
    ${vistaMeta(M.metricas)}
    ${vistaCadena(M.porEtapa)}
    <div class="tabs" role="tablist">
      <button role="tab" id="t-flujo" aria-controls="p-flujo" aria-selected="${ESTADO.tab === 'flujo'}">Flujo y SLA</button>
      <button role="tab" id="t-cap" aria-controls="p-cap" aria-selected="${ESTADO.tab === 'cap'}">Capacidad y saturación</button>
    </div>
    <section class="panel" id="p-flujo" role="tabpanel" aria-labelledby="t-flujo" ${ESTADO.tab === 'flujo' ? '' : 'hidden'}>${vistaFlujo(M)}</section>
    <section class="panel" id="p-cap" role="tabpanel" aria-labelledby="t-cap" ${ESTADO.tab === 'cap' ? '' : 'hidden'}>${vistaCapacidad(M)}</section>`;

  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on('c-mes', 'change', e => { ESTADO.mes = e.target.value; recalcular(); });
  on('c-seg', 'change', e => { ESTADO.segmento = e.target.value; recalcular(); });
  app.querySelectorAll('[data-uni]').forEach(b => b.addEventListener('click', () => { ESTADO.unidad = b.dataset.uni; render(); }));
  on('c-hor', 'change', e => { ESTADO.horizonte = +e.target.value; recalcular(); });
  on('c-t0', 'change', e => { ESTADO.t0 = e.target.value; cargar(); });
  on('t-flujo', 'click', () => { ESTADO.tab = 'flujo'; render(); });
  on('t-cap', 'click', () => { ESTADO.tab = 'cap'; render(); });
  on('c-salir', 'click', async () => { await sb.auth.signOut(); location.reload(); });
}

function recalcular() {
  ESTADO.modelo = construirModelo(ESTADO.raw, { horizonte: ESTADO.horizonte, mes: ESTADO.mes, segmento: ESTADO.segmento });
  render();
}

async function cargar() {
  const app = document.getElementById('app');
  try {
    if (DEMO) {
      ESTADO.raw = datosEjemplo();
      if (ESTADO.t0) { // en modo ejemplo, recorta la serie para simular otra línea base
        const i = ESTADO.raw.semanas.indexOf(ESTADO.t0);
        if (i > 0) ESTADO.raw.semanas = ESTADO.raw.semanas.slice(i);
      }
    } else {
      ESTADO.raw = await cargarSupabase(ESTADO.t0);
    }
    if (!ESTADO.segmento) {
      const segs = [...new Set(ESTADO.raw.etapas.map(e => e.pipeline))];
      ESTADO.segmento = segs.find(s => s.includes('Enterprise')) || segs[0] || null;
    }
    recalcular();
  } catch (err) {
    app.innerHTML = `<div class="acceso"><h1>No se pudieron cargar los datos</h1><p class="estado error">${esc(err.message)}</p></div>`;
  }
}

function vistaAcceso(mensaje, esError) {
  const dominio = CFG.dominioPermitido || 'niko.mx';
  document.getElementById('app').innerHTML = `
    <div class="acceso">
      <h1>Ticket System: capacidad y flujo</h1>
      <p class="nota">Entra con tu cuenta de Google de @${esc(dominio)}.</p>
      <button class="primario" type="button" id="b-google">Entrar con Google</button>
      <p class="estado${esError ? ' error' : ''}" id="estado-acceso">${mensaje ? esc(mensaje) : ''}</p>
    </div>`;
  document.getElementById('b-google').addEventListener('click', async () => {
    const estado = document.getElementById('estado-acceso');
    estado.className = 'estado';
    estado.textContent = 'Abriendo Google…';
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: location.origin + location.pathname,
        queryParams: { hd: dominio, prompt: 'select_account' },
      },
    });
    if (error) { estado.className = 'estado error'; estado.textContent = error.message; }
  });
}

// La sesión puede venir de cualquier cuenta de Google: RLS ya bloquea los datos,
// esto es para que la persona entienda por qué no ve nada.
async function sesionValida(session) {
  const dominio = CFG.dominioPermitido || 'niko.mx';
  const correo = (session && session.user && session.user.email || '').toLowerCase();
  if (correo.endsWith('@' + dominio)) return true;
  await sb.auth.signOut();
  vistaAcceso(correo
    ? `La cuenta ${correo} no es de @${dominio}. Cerramos la sesión: entra con tu cuenta de Niko.`
    : `Esa cuenta no es de @${dominio}. Entra con tu cuenta de Niko.`, true);
  return false;
}

async function iniciar() {
  if (DEMO) return cargar();
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  if (data.session) { if (await sesionValida(data.session)) return cargar(); }
  else vistaAcceso();
  sb.auth.onAuthStateChange(async (ev, session) => { if (session && await sesionValida(session)) cargar(); });
}

if (typeof document !== 'undefined') iniciar();
</script>
