<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket System: capacidad y flujo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="modelo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Tokens del manual claro de Niko (Niko_Look_and_Feel.md) */
:root {
  color-scheme: light;
  --hs-bg: #F5F8FA; --hs-card: #FFFFFF; --hs-border: #DFE3EB;
  --hs-text: #111111; --hs-muted: #5F6B7A; --hs-ink: #000000;
  --hs-yellow: #E6FF00; --hs-yellow-tenue: #F7FFB3; --hs-gull: #96A3B5;
  --hs-red: #D92D20; --hs-red-bg: #FEF3F2;
  --hs-shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--hs-bg); color: var(--hs-text);
  font-family: 'Lexend', system-ui, sans-serif;
  font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums;
}
a { color: var(--hs-text); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--hs-ink); outline-offset: 2px; }

/* Encabezado global */
.global { position: sticky; top: 0; z-index: 10; background: var(--hs-card); border-bottom: 1px solid var(--hs-border); }
.global-in { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { font-weight: 700; font-size: 18px; color: var(--hs-ink); text-decoration: none; }
.marca span { font-weight: 400; font-size: 13px; color: var(--hs-muted); margin-left: 8px; }

.wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-weight: 600; font-size: 28px; line-height: 1.15; margin: 0; }
.meta-linea { color: var(--hs-muted); font-size: 12px; margin-top: 4px; }
.aviso { margin: 16px 0 0; padding: 8px 12px; border: 1px solid var(--hs-border); border-radius: 8px; background: var(--hs-card); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.aviso .badge-nuevo { background: var(--hs-yellow); color: var(--hs-ink); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.aviso.error { border-color: var(--hs-red); background: var(--hs-red-bg); }

/* Controles */
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--hs-muted); }
.controles label { display: inline-flex; align-items: center; gap: 6px; }
select, input[type=email], button {
  font: inherit; font-size: 13px; color: var(--hs-text); background: var(--hs-card);
  border: 1px solid var(--hs-border); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; transition: background-color .2s, color .2s; }
button.primario { background: var(--hs-ink); color: #fff; border-color: var(--hs-ink); }
.seg { display: inline-flex; border: 1px solid var(--hs-border); border-radius: 999px; overflow: hidden; background: var(--hs-card); }
.seg button { border: 0; border-radius: 0; padding: 5px 12px; }
.seg button[aria-pressed=true] { background: var(--hs-ink); color: #fff; }

/* Meta del mes */
.meta { margin-top: 20px; padding: 20px; background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 12px; box-shadow: var(--hs-shadow); }
.meta-cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cifra { border-left: 1px solid var(--hs-border); padding-left: 12px; }
.cifra:first-child { border-left: 0; padding-left: 0; }
.cifra .l { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.cifra .n { font-weight: 600; font-size: 28px; line-height: 1.15; margin-top: 4px; }
.cifra .s { color: var(--hs-muted); font-size: 12px; margin-top: 2px; }
.cifra.delta.neg .n { color: var(--hs-red); }
.mk { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
.mk.goal { background: none; border-left: 2px solid var(--hs-ink); border-radius: 0; width: 6px; }
.mk.fc { background: var(--hs-yellow); outline: 1px solid var(--hs-ink); outline-offset: -1px; }
.mk.re { background: var(--hs-ink); }
.barra { position: relative; height: 16px; margin: 20px 0 6px; background: var(--hs-bg); border: 1px solid var(--hs-border); border-radius: 8px; }
.barra .fc { position: absolute; inset: 0 auto 0 0; background: var(--hs-yellow); border-radius: 7px; }
.barra .re { position: absolute; inset: 0 auto 0 0; background: var(--hs-ink); border-radius: 7px 0 0 7px; }
.barra .gl { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--hs-ink); }
.barra .gl::after { content: 'Goal'; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; }
.barra-ejes { display: flex; justify-content: space-between; color: var(--hs-muted); font-size: 12px; }

/* Tablero de etapas */
.cadena { margin-top: 24px; }
.cadena-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 768px) { .cadena-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .cadena-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.etapa { display: flex; flex-direction: column; min-height: 0; padding: 7px 9px 8px; background: var(--hs-card); border: 1px solid var(--hs-border); border-top: 3px solid transparent; border-radius: 8px; }
.etapa.inst { border-top-color: var(--hs-ink); }
.etapa .e { font-size: 13px; font-weight: 600; }
.etapa .tag { font-size: 10px; font-weight: 600; color: var(--hs-muted); }
.etapa .v { font-weight: 600; font-size: 18px; margin-top: 2px; line-height: 1.15; }
.etapa .k { color: var(--hs-muted); font-size: 12px; }
.etapa .t0d { margin-top: 4px; font-size: 11px; color: var(--hs-muted); }
.fuera-flujo { margin-top: 12px; padding: 10px 10px 2px; border: 1px dashed var(--hs-border); border-radius: 8px; }
.fuera-flujo .nota { margin: 0 0 8px; }
.fuera-flujo .etapa { min-height: 0; }
table.t0 th.par, table.t0 td.par { border-left: 1px solid var(--hs-border); }
table.t0 th.sub { font-size: 11px; font-weight: 500; color: var(--hs-muted); }
table.t0 td.esc { font-size: 10px; color: var(--hs-muted); text-transform: uppercase; letter-spacing: .3px; }
table.t0 tr.esc-goal td { background: rgba(230,255,0,.07); }
table.t0 tr.esc-real td:not(.esc) { font-weight: 600; }
.brecha { display: block; font-size: 10px; color: var(--hs-muted); }
.brecha.neg { color: var(--hs-red); }
table.t0 .fut { border-top: 1px dashed var(--hs-border); border-bottom: 1px dashed var(--hs-border); color: var(--hs-muted); background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(150,163,181,.06) 6px 12px); }
table.t0 th.fut { font-style: italic; }
.vspron { display: block; font-size: 10px; color: var(--hs-muted); font-style: italic; }

/* ---- Secciones colapsables ---- */
.sec { margin-top: 10px; }
.sec h2 { display: flex; align-items: center; gap: 6px; margin: 0; }
.sec-t { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; background: none; border: 0; padding: 6px 0; font: inherit; font-size: 15px; font-weight: 600; color: var(--hs-text); cursor: pointer; text-align: left; }
.sec-t:focus-visible { outline: 2px solid var(--hs-ink); outline-offset: 2px; border-radius: 4px; }
.chev { flex: none; width: 0; height: 0; border-left: 5px solid var(--hs-muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
.sec-t[aria-expanded="true"] .chev { transform: rotate(90deg); }
.sec-n { flex: none; }
.sec-s { font-weight: 400; font-size: 13px; color: var(--hs-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-s::before { content: '· '; }
.sec-c { padding-bottom: 4px; }
.fuente { margin: 0 0 8px; font-size: 11px; color: var(--hs-muted); }

/* ---- ⓘ definicion: funciona con cursor, teclado y toque ---- */
.info { flex: none; width: 15px; height: 15px; padding: 0; border-radius: 50%; border: 1px solid var(--hs-border); background: var(--hs-card); color: var(--hs-muted); font: 600 10px/13px Lexend, system-ui, sans-serif; cursor: pointer; vertical-align: middle; position: relative; }
.info:hover, .info:focus-visible, .info.abierto { background: var(--hs-ink); color: #fff; border-color: var(--hs-ink); }
.info::after { content: attr(data-def); position: absolute; z-index: 30; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); width: max-content; max-width: 260px; padding: 8px 10px; background: var(--hs-ink); color: #fff; font: 400 12px/1.4 Lexend, system-ui, sans-serif; text-align: left; white-space: normal; border-radius: 6px; box-shadow: var(--hs-shadow); opacity: 0; visibility: hidden; transition: opacity .12s; pointer-events: none; }
.info:hover::after, .info:focus-visible::after, .info.abierto::after { opacity: 1; visibility: visible; }
th .info { margin-left: 2px; }
.num { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-bottom: 1px dotted var(--hs-gull); }
.num:hover, .num:focus-visible { border-bottom-color: var(--hs-ink); border-bottom-style: solid; }
.panel-det { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 94vw); z-index: 40; background: var(--hs-card); border-left: 1px solid var(--hs-border); box-shadow: var(--hs-shadow); display: flex; flex-direction: column; padding: 14px 16px; overflow: auto; }
.panel-det[hidden] { display: none; }
.panel-det header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-det h2 { font-size: 15px; margin: 0; }
.pd-n { margin: 4px 0 10px; font-size: 12px; color: var(--hs-muted); }
.pd-mal { display: block; margin-top: 4px; color: var(--hs-red); font-weight: 600; }
.pd-ord { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; cursor: pointer; color: inherit; }
.panel-det tr.marca { background: var(--hs-yellow-tenue, #fbfde0); }
ol.comoPron { margin: 0 0 8px; padding-left: 18px; font-size: 12px; color: var(--hs-text); }
ol.comoPron li { margin-bottom: 3px; }
details.cuello { border: 1px solid var(--hs-border); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
details.cuello > summary { cursor: pointer; }
.sim { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; border: 1px dashed var(--hs-border); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
.sim label { font-size: 12px; }
.sim.on { border-color: var(--hs-ink); background: var(--hs-yellow-tenue, #fbfde0); }
.panel-det tr.marca td { font-weight: 600; }
table.pasos { width: 100%; margin-top: 6px; border-collapse: collapse; font-size: 11px; }
table.pasos th, table.pasos td { padding: 3px 5px; border-top: 1px solid var(--hs-border); text-align: right; }
table.pasos th.izq, table.pasos td.izq { text-align: left; }
table.pasos tr.marca { background: var(--hs-yellow-tenue, #fbfde0); font-weight: 600; }
.panel-det td.asunto { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-det table { table-layout: auto; width: 100%; }
.info.anc-izq::after { left: 0; transform: none; }
.info.anc-der::after { left: auto; right: 0; transform: none; }

/* ---- Densidad alta ---- */
.sec h2, h2 { font-size: 15px; }
.tabla table { font-size: 12px; }
.tabla th, .tabla td { padding: 4px 6px; }
.resumen { gap: 10px; }
.equipo { padding: 8px 10px; }
.grupo { margin-top: 14px; }
.grupo:first-of-type { margin-top: 8px; }
.grupo-t { font-size: 13px; font-weight: 600; color: var(--hs-muted); margin-bottom: 6px; }
details.aviso.fuera > summary { cursor: pointer; font-weight: 600; }
details.aviso.fuera .tabla { margin-top: 10px; }

/* Pestañas */
.tabs { display: flex; gap: 16px; margin-top: 32px; border-bottom: 1px solid var(--hs-border); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 2px; margin-bottom: -1px; font-size: 15px; font-weight: 500; color: var(--hs-muted); }
.tabs button:hover { color: var(--hs-text); }
.tabs button[aria-selected=true] { color: var(--hs-text); border-bottom-color: var(--hs-ink); font-weight: 600; }
section.panel { padding-top: 20px; }
section.panel[hidden] { display: none; }
h2 { font-weight: 600; font-size: 18px; margin: 28px 0 4px; }
h2:first-child { margin-top: 0; }
.nota { color: var(--hs-muted); font-size: 13px; margin: 0 0 12px; max-width: 80ch; }

.resumen { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 0 0 8px; }
.resumen div b { display: block; font-weight: 600; font-size: 24px; }
.resumen div span { color: var(--hs-muted); font-size: 12px; }

/* Tablas */
.tabla { overflow-x: auto; background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 8px; box-shadow: var(--hs-shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--hs-border); white-space: nowrap; }
th { font-size: 12px; font-weight: 500; color: var(--hs-muted); background: var(--hs-card); position: sticky; top: 0; }
th:first-child, td:first-child, td.izq, th.izq { text-align: left; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 600; border-top: 1px solid var(--hs-border); }
td small { color: var(--hs-muted); font-size: 12px; }
td:first-child small { display: block; }
.dif { font-size: 12px; color: var(--hs-muted); margin-left: 4px; }

/* Badges de estado: siempre con texto e icono, no solo color */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; border: 1px solid var(--hs-border); background: var(--hs-card); color: var(--hs-text); }
.pill.bad { background: var(--hs-red-bg); color: var(--hs-red); border-color: var(--hs-red); }
.pill.bad::before { content: '!'; display: inline-grid; place-items: center; width: 12px; height: 12px; border-radius: 50%; background: var(--hs-red); color: #fff; font-size: 9px; }
.pill.warn { border-style: dashed; border-color: var(--hs-ink); }
.pill.warn::before { content: '◐'; }
.pill.ok::before { content: '✓'; }
.pill.mute { color: var(--hs-muted); border-style: dashed; }
.supuesto { border-bottom: 1px dotted var(--hs-muted); cursor: help; }

/* Equipos */
.equipos { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .equipos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .equipos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.equipo { background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 8px; padding: 12px 16px; box-shadow: var(--hs-shadow); }
.equipo.bad { border-left: 4px solid var(--hs-red); }
.equipo.warn { border-style: dashed; border-color: var(--hs-ink); }
.equipo.mute { border-style: dashed; }
.equipo h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.equipo .util { font-weight: 600; font-size: 24px; line-height: 1.2; margin-top: 4px; }
.equipo .util.bad { color: var(--hs-red); }
.equipo ul { margin: 8px 0 0; padding-left: 16px; font-size: 12px; color: var(--hs-muted); }
.equipo svg { display: block; width: 100%; height: 44px; margin-top: 8px; }

/* Acceso */
.acceso { max-width: 512px; margin: 12vh auto 0; background: var(--hs-card); border: 1px solid var(--hs-border); border-radius: 12px; padding: 24px; box-shadow: var(--hs-shadow); }
.acceso h1 { font-size: 20px; }
.acceso .primario { margin-top: 16px; width: 100%; }
.estado { color: var(--hs-muted); font-size: 13px; margin-top: 12px; }
.error { color: var(--hs-red); }

@media (max-width: 720px) {
  .meta-cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cifra:nth-child(3) { border-left: 0; padding-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .barra .fc, .barra .re { transition: width .2s ease-out; }
  .tf-fade { animation: tf-fade .2s ease-out; }
  @keyframes tf-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

<div class="global"><div class="global-in"><a class="marca" href="./">Niko<span>Ticket System</span></a><div id="global-acciones"></div></div></div>
<div class="wrap" id="app"><p class="estado">Cargando…</p></div>

<script>
'use strict';
// ====================== Configuración ======================
const CFG = (typeof window !== 'undefined' && window.NIKO_CONFIG) || {};
const DEMO = !CFG.supabaseUrl || CFG.supabaseUrl.includes('TU-PROYECTO');
const DAY = 864e5;
const fmt = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 0 });
const fmt1 = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 1 });
const pct = v => (v == null || !isFinite(v)) ? '—' : fmt.format(v * 100) + ' %';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (a, f = x => x) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const groupBy = (a, f) => a.reduce((m, x) => { const k = f(x); (m[k] ||= []).push(x); return m; }, {});
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// ====================== Días hábiles (hora CDMX) ======================
// Los días se representan como milisegundos UTC a medianoche.
function toDay(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return Date.parse(v + 'T00:00:00Z');
  const t = typeof v === 'number' ? v : Date.parse(v);
  if (isNaN(t)) return null;
  const d = new Date(t - 6 * 36e5);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
const isoDay = t => new Date(t).toISOString().slice(0, 10);
let FERIADOS = new Set();
function esHabil(t) { const w = new Date(t).getUTCDay(); return w !== 0 && w !== 6 && !FERIADOS.has(t); }
function habilesEntre(a, b) { // desde a (incluido) hasta b (excluido)
  if (a == null || b == null) return null;
  const [s, e] = a <= b ? [a, b] : [b, a];
  let n = 0; for (let t = s; t < e; t += DAY) if (esHabil(t)) n++;
  return a <= b ? n : -n;
}
function siguientesHabiles(desde, n) { const out = []; let t = desde; while (out.length < n) { if (esHabil(t)) out.push(t); t += DAY; } return out; }
const HOY = toDay(Date.now());

// ====================== Modelo ======================
// Recibe los datos crudos (de Supabase o de ejemplo) y calcula todo lo que muestra la página.
function construirModelo(raw, opciones) {
  const { horizonte, mes, segmento } = opciones;
  FERIADOS = new Set(raw.feriados.map(f => toDay(f.fecha)));

  const cat = {};
  for (const c of raw.catalogo) cat[c.tipo + '|' + c.segmento] = c;
  const buscarCat = (tipo, seg) => cat[tipo + '|' + seg] || raw.catalogo.find(c => c.tipo === tipo) || null;

  const personas = {};
  for (const p of raw.personas.filter(p => p.activo !== false)) personas[p.owner_id] = { ...p };
  const ausencia = {};
  for (const a of raw.ausencias) ausencia[a.owner_id + '|' + toDay(a.fecha)] = Number(a.horas) || 0;

  const hace28 = HOY - 28 * DAY;
  const habiles28 = Math.max(1, habilesEntre(hace28, HOY));

  // --- Tickets
  const tickets = raw.tickets.map(t0 => {
    const t = { ...t0 };
    const c = buscarCat(t.tipo, t.segmento);
    t.cat = c;
    t.sla = c && c.sla_dias != null ? Number(c.sla_dias) : null;
    t.d0 = toDay(t.creado); t.d1 = toDay(t.cerrado);
    t.abierto = t.d1 == null;
    t.edad = habilesEntre(t.d0, t.d1 ?? HOY);
    const enRevision = /review|revisi/i.test(t.etapa_ticket || '');
    const h = c ? (enRevision ? c.esfuerzo_rev_h : c.esfuerzo_prod_h) : null;
    const mult = c && c.unidad === 'sitio' ? Math.max(1, Number(t.sitios) || 1) : 1;
    t.horas = h == null || h === '' || isNaN(h) ? null : Number(h) * mult;
    t.firme = !!c && c.estado === 'firme';
    t.estadoSla = t.sla == null ? 'sin' : t.edad > t.sla ? 'vencido' : t.edad >= 0.8 * t.sla ? 'riesgo' : 'ok';
    t.creado28 = t.d0 != null && t.d0 >= hace28;
    t.cerrado28 = t.d1 != null && t.d1 >= hace28;
    t.persona = personas[t.owner_id] || null;
    return t;
  });
  // Etapas inactivas (Inviable, Dormant, Churned): ni sus deals ni sus tickets cuentan.
  const etapaPorId = Object.fromEntries(raw.etapas.map(e => [e.etapa_id, e]));
  const inactiva = id => !!(etapaPorId[id] && etapaPorId[id].es_inactivo);
  const etapaDeDeal = Object.fromEntries(raw.deals.map(d => [d.deal_id, d.etapa_id]));
  // Solo si TODOS sus deals estan en etapa inactiva: un ticket compartido sigue contando.
  const soloDealsInactivos = t => (t.deal_ids || []).length > 0
    && t.deal_ids.every(id => inactiva(etapaDeDeal[id]));

  const abiertosTodos = tickets.filter(t => t.abierto);
  const ticketsInactivos = abiertosTodos.filter(soloDealsInactivos).map(t => ({
    ...t,
    etapaDeal: (t.deal_ids || []).map(id => (etapaPorId[etapaDeDeal[id]] || {}).etiqueta)
      .filter(Boolean).join(', '),
  }));
  const abiertos = abiertosTodos.filter(t => !soloDealsInactivos(t));

  // --- Capacidad por persona en el horizonte
  const dias = siguientesHabiles(HOY, horizonte);
  const capDia = (p, d) => p.fte * p.foco * Math.max(0, p.jornada_h - (ausencia[p.owner_id + '|' + d] || 0));
  for (const p of Object.values(personas)) {
    const mios = tickets.filter(t => t.owner_id === p.owner_id);
    const misAbiertos = mios.filter(t => t.abierto);
    p.lAbiertos = misAbiertos;
    p.backlogN = misAbiertos.length;
    p.backlogH = sum(misAbiertos, t => t.horas);
    p.sinEsfuerzo = misAbiertos.filter(t => t.horas == null).length;
    p.entradaDiaH = sum(mios.filter(t => t.creado28), t => t.horas) / habiles28;
    p.entradaDiaN = mios.filter(t => t.creado28).length / habiles28;
    p.salidaDiaN = mios.filter(t => t.cerrado28).length / habiles28;
    p.capPorDia = dias.map(d => capDia(p, d));
    p.dispH = sum(p.capPorDia);
    p.reqH = p.backlogH + p.entradaDiaH * dias.length;
    p.util = p.dispH > 0 ? p.reqH / p.dispH : null;
    const capMedia = p.dispH / dias.length;
    p.colaDias = capMedia > 0 ? p.backlogH / capMedia : Infinity;
    const neto = capMedia - p.entradaDiaH;
    p.diasVaciar = p.backlogH === 0 ? 0 : neto > 0 ? p.backlogH / neto : Infinity;
    const conHoras = mios.filter(t => t.horas != null);
    p.esfuerzoMedio = conHoras.length ? sum(conHoras, t => t.horas) / conHoras.length : null;
    p.ticketsQueCaben = p.esfuerzoMedio ? Math.floor(p.dispH / p.esfuerzoMedio) : null;
    p.ausenciasH = sum(dias, d => ausencia[p.owner_id + '|' + d] || 0);
    let b = p.backlogH; p.proyeccion = [b];
    for (const c of p.capPorDia) { b = Math.max(0, b + p.entradaDiaH - c); p.proyeccion.push(b); }
  }

  // --- Reparto de la capacidad de cada persona entre equipos
  // 1) persona_equipos manda. 2) un equipo con «/» y sin porcentajes se reparte según
  // la mezcla de pipelines de sus tickets de los últimos 28 días (queda como supuesto).
  // 3) en cualquier otro caso, toda su capacidad va a personas.equipo.
  const pePorOwner = groupBy(raw.personaEquipos || [], r => r.owner_id);
  for (const p of Object.values(personas)) {
    const filas = (pePorOwner[p.owner_id] || []).filter(r => Number(r.porcentaje) > 0);
    const total = sum(filas, r => Number(r.porcentaje));
    if (filas.length && total > 0) {
      p.pesos = {}; for (const r of filas) p.pesos[r.equipo] = (p.pesos[r.equipo] || 0) + Number(r.porcentaje) / total;
      p.pesosSupuestos = false;
    } else if ((p.equipo || '').includes('/')) {
      const partes = p.equipo.split('/').map(x => x.trim()).filter(Boolean);
      // Lo que la persona trabajó, no lo que se creó: los abiertos de hoy más los que
      // cerró en 28 días. Así cuenta la revisión que le llega por reasignación.
      const recientes = tickets.filter(t => t.owner_id === p.owner_id && t.equipo
        && (t.abierto || t.cerrado28));
      const porPipe = groupBy(recientes, t => t.equipo);
      const n = recientes.length;
      p.pesos = n
        ? Object.fromEntries(Object.entries(porPipe).map(([eq, ts]) => [eq, ts.length / n]))
        : Object.fromEntries(partes.map(x => [x, 1 / partes.length]));
      p.pesosSupuestos = true;
    } else {
      p.pesos = { [p.equipo]: 1 };
      p.pesosSupuestos = false;
    }
  }

  // --- Equipos: la demanda es del pipeline del ticket, la oferta son los pesos
  const demandaPorEquipo = groupBy(abiertos.filter(t => t.equipo), t => t.equipo);
  const entradaPorEquipo = groupBy(tickets.filter(t => t.creado28 && t.equipo), t => t.equipo);
  const salidaPorEquipo = groupBy(tickets.filter(t => t.cerrado28 && t.equipo), t => t.equipo);
  const nombresEquipo = [...new Set([
    ...Object.keys(demandaPorEquipo), ...Object.keys(entradaPorEquipo), ...Object.keys(salidaPorEquipo),
    ...Object.values(personas).flatMap(p => Object.keys(p.pesos)),
  ])].filter(Boolean).sort();

  const equipos = nombresEquipo.map(nombre => {
    // Personas que aportan capacidad a este equipo, con su fracción.
    const ps = Object.values(personas).filter(p => (p.pesos[nombre] || 0) > 0);
    const w = p => p.pesos[nombre] || 0;
    const abiertosEq = demandaPorEquipo[nombre] || [];
    const e = { nombre, personas: ps };
    e.supuesto = ps.some(p => p.pesosSupuestos);
    e.dispH = sum(ps, p => p.dispH * w(p));
    e.backlogH = sum(abiertosEq, t => t.horas);
    e.backlogN = abiertosEq.length;
    e.abiertos = abiertosEq;
    e.sinEsfuerzo = abiertosEq.filter(t => t.horas == null).length;
    e.entradaDiaH = sum(entradaPorEquipo[nombre] || [], t => t.horas) / habiles28;
    e.reqH = e.backlogH + e.entradaDiaH * dias.length;
    e.util = e.dispH > 0 ? e.reqH / e.dispH : null;
    e.entradaSem = (entradaPorEquipo[nombre] || []).length / habiles28 * 5;
    e.salidaSem = (salidaPorEquipo[nombre] || []).length / habiles28 * 5;
    const capDiaEq = dias.map((_, i) => sum(ps, p => p.capPorDia[i] * w(p)));
    let b = e.backlogH; e.proyeccion = [b];
    for (const c of capDiaEq) { b = Math.max(0, b + e.entradaDiaH - c); e.proyeccion.push(b); }
    const porOwner = groupBy(abiertosEq, t => t.owner_id);
    const topOwner = Object.entries(porOwner).sort((a, b) => b[1].length - a[1].length)[0];
    e.concentracion = e.backlogN && topOwner ? topOwner[1].length / e.backlogN : 0;
    e.top = topOwner ? (personas[topOwner[0]] || { nombre: topOwner[0] }) : { nombre: '—' };
    e.diaVacio = e.proyeccion.findIndex((v, i) => i > 0 && v === 0);
    e.alertas = [];
    if (e.util == null) e.alertas.push('Sin horas disponibles en el horizonte');
    else if (e.util > 1) e.alertas.push(`Faltan ${fmt.format(e.reqH - e.dispH)} h en ${dias.length} días hábiles`);
    if (e.entradaSem > e.salidaSem * 1.1 && e.entradaSem >= 1) e.alertas.push(`La fila crece: entran ${fmt1.format(e.entradaSem)} y salen ${fmt1.format(e.salidaSem)} por semana`);
    if (e.concentracion >= 0.7 && e.backlogN >= 5 && ps.length > 1) e.alertas.push(`${e.top.nombre} tiene ${pct(e.concentracion)} de los abiertos`);
    if (ps.length === 1 && e.backlogN >= 5) e.alertas.push(`Depende de una sola persona (${e.top.nombre})`);
    if (!ps.length && e.backlogN) e.alertas.push('Nadie tiene capacidad asignada a este pipeline');
    if (e.supuesto) e.alertas.push('Parte de la capacidad se repartió por la mezcla de tickets que esas personas trabajaron (abiertos hoy más cerrados en 28 días), no por porcentajes cargados');
    if (e.sinEsfuerzo) e.alertas.push(`${e.sinEsfuerzo} abiertos sin esfuerzo en el catálogo: la carga real es mayor`);
    e.sinDatos = e.backlogN > 0 && e.sinEsfuerzo === e.backlogN;
    e.nivel = e.sinDatos ? 'mute' : e.util == null || e.util > 1 ? 'bad' : e.util > 0.85 || e.alertas.length > 1 ? 'warn' : 'ok';
    return e;
  }).sort((a, b) => (b.util ?? 99) - (a.util ?? 99));
  const sinPersona = abiertos.filter(t => !t.persona);

  // --- Etapas y deals
  const etapas = raw.etapas.filter(e => (!segmento || e.pipeline === segmento) && !e.es_inactivo).sort((a, b) => a.orden - b.orden);
  const deals = raw.deals.filter(d => (!segmento || d.segmento === segmento) && !inactiva(d.etapa_id));
  const esInstalado = d => !!(etapaPorId[d.etapa_id] && etapaPorId[d.etapa_id].es_instalado);

  const porEtapa = etapas.map(e => {
    const ds = deals.filter(d => d.etapa_id === e.etapa_id).map(d => ({ ...d, etapaEtiqueta: e.etiqueta }));
    return { ...e, sitios: ds.length, kwp: sum(ds, d => d.kwp), ds };
  });

  // Evolución semanal: T0, 1S, 2S…
  const series = raw.series.filter(r => (!segmento || r.segmento === segmento) && !inactiva(r.etapa_id));
  const semanas = raw.semanas.map((fecha, i) => {
    const filas = series.filter(r => r.snapshot_date === fecha);
    const pe = {};
    for (const e of etapas) { const ds = filas.filter(r => r.etapa_id === e.etapa_id); pe[e.etapa_id] = { sitios: ds.length, kwp: sum(ds, d => d.kwp) }; }
    return { fecha, etiqueta: i === 0 ? 'T0' : `${i}S`, porEtapa: pe, filas, sitios: sum(Object.values(pe), x => x.sitios), kwp: sum(Object.values(pe), x => x.kwp) };
  });

  // --- Goal, forecast y real del mes
  const [anio, m] = mes.split('-').map(Number);
  const iniMes = Date.UTC(anio, m - 1, 1), finMes = Date.UTC(anio, m, 1);
  const metaRow = raw.metas.find(x => toDay(x.mes) === iniMes);
  const goal = metaRow ? { sitios: +metaRow.sitios, kwp: +metaRow.kwp } : (CFG.metaPorDefecto || { sitios: 80, kwp: 1200 });
  const comprometidos = deals.filter(d => { const f = toDay(d.fecha_instalacion); return f != null && f >= iniMes && f < finMes; });
  const ticketsPorDeal = {};
  for (const t of abiertos) for (const id of (t.deal_ids || [])) (ticketsPorDeal[id] ||= []).push(t);

  const evaluados = comprometidos.map(d => {
    const r = { deal: d, instalado: esInstalado(d) };
    const fecha = toDay(d.fecha_instalacion);
    r.diasRestantes = habilesEntre(HOY, fecha);
    if (r.instalado) { r.enForecast = true; r.motivo = 'Instalado'; return r; }
    const ts = ticketsPorDeal[d.deal_id] || [];
    if (!ts.length) { r.enForecast = r.diasRestantes >= 0; r.motivo = r.enForecast ? 'Sin tickets abiertos' : 'La fecha ya pasó y no está instalado'; r.supuesto = true; return r; }
    let peor = null;
    for (const t of ts) {
      const cola = t.persona ? t.persona.colaDias : Infinity;
      const restanteSla = Math.max(0, (t.sla ?? 0) - t.edad);
      const demora = cola + restanteSla;
      if (!peor || demora > peor.demora) peor = { t, demora, cola };
    }
    r.demora = peor.demora; r.cuello = peor.t;
    r.enForecast = peor.demora <= r.diasRestantes;
    r.motivo = !peor.t.persona ? `Owner fuera del modelo en ${peor.t.tipo}`
      : r.enForecast ? 'A tiempo con la capacidad actual'
      : `${peor.t.persona.equipo} (${peor.t.persona.nombre}): necesita ${fmt1.format(peor.demora)} días hábiles entre fila y SLA, y quedan ${r.diasRestantes}`;
    return r;
  });
  const enF = evaluados.filter(r => r.enForecast), reales = evaluados.filter(r => r.instalado);
  const conEtapa = d => ({ ...d, etapaEtiqueta: (etapaPorId[d.etapa_id] || {}).etiqueta });
  const metricas = {
    goal,
    plan: { sitios: comprometidos.length, kwp: sum(comprometidos, d => d.kwp) },
    forecast: { sitios: enF.length, kwp: sum(enF, r => r.deal.kwp) },
    real: { sitios: reales.length, kwp: sum(reales, r => r.deal.kwp) },
    fuera: evaluados.filter(r => !r.enForecast).sort((a, b) => (b.demora ?? 0) - (a.demora ?? 0)),
    // Listas exactas detrás de cada cifra, para el panel de detalle.
    listas: {
      plan: comprometidos.map(conEtapa),
      forecast: enF.map(r => conEtapa(r.deal)),
      real: reales.map(r => conEtapa(r.deal)),
    },
  };

  // --- Resumen de tickets por tipo
  const porTipo = Object.values(groupBy(tickets, t => t.tipo + '|' + (t.segmento || ''))).map(ts => {
    const ab = ts.filter(t => t.abierto), cer = ts.filter(t => t.cerrado28);
    const conSla = cer.filter(t => t.sla != null);
    return {
      tipo: ts[0].tipo, segmento: ts[0].segmento, equipo: ts[0].equipo, sla: ts[0].sla, firme: ts[0].firme,
      abiertos: ab.length,
      vencidos: ab.filter(t => t.estadoSla === 'vencido').length,
      riesgo: ab.filter(t => t.estadoSla === 'riesgo').length,
      edadMediana: median(ab.map(t => t.edad)),
      creados28: ts.filter(t => t.creado28).length, cerrados28: cer.length,
      cumplimiento: conSla.length ? conSla.filter(t => t.edad <= t.sla).length / conSla.length : null,
      horasBacklog: sum(ab, t => t.horas),
      // Listas exactas detrás de cada celda.
      lAbiertos: ab,
      lVencidos: ab.filter(t => t.estadoSla === 'vencido'),
      lRiesgo: ab.filter(t => t.estadoSla === 'riesgo'),
      lCreados28: ts.filter(t => t.creado28), lCerrados28: cer, lConSla: conSla,
    };
  }).sort((a, b) => b.abiertos - a.abiertos);

  const cerrados28 = tickets.filter(t => t.cerrado28 && t.sla != null);
  const lResumen = {
    abiertos, vencidos: abiertos.filter(t => t.estadoSla === 'vencido'),
    riesgo: abiertos.filter(t => t.estadoSla === 'riesgo'), cerrados28,
  };
  return {
    tickets, abiertos, personas: Object.values(personas), equipos, sinPersona, ticketsInactivos, dias,
    porEtapa, semanas, metricas, porTipo, lResumen, catalogo: raw.catalogo,
    resumen: {
      abiertos: abiertos.length,
      vencidos: abiertos.filter(t => t.estadoSla === 'vencido').length,
      riesgo: abiertos.filter(t => t.estadoSla === 'riesgo').length,
      sinSla: abiertos.filter(t => t.estadoSla === 'sin').length,
      cumplimiento: cerrados28.length ? cerrados28.filter(t => t.edad <= t.sla).length / cerrados28.length : null,
      sitiosT0: semanas[0]?.sitios ?? 0, kwpT0: semanas[0]?.kwp ?? 0,
    },
  };
}

// ====================== Datos: Supabase ======================
let sb = null;
async function traerTodo(tabla, columnas, filtro) {
  const out = [];
  for (let desde = 0; ; desde += 1000) {
    let q = sb.from(tabla).select(columnas).range(desde, desde + 999);
    if (filtro) q = filtro(q);
    const { data, error } = await q;
    if (error) throw new Error(`${tabla}: ${error.message}`);
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
// La tabla puede no existir todavía: sin ella, cada persona va completa a su equipo.
async function traerOpcional(tabla, columnas) {
  try { return await traerTodo(tabla, columnas); } catch (e) { return []; }
}
function elegirSemanas(fechas, t0) {
  const ordenadas = [...fechas].sort();
  const inicio = t0 && ordenadas.includes(t0) ? t0 : ordenadas[0];
  const posteriores = ordenadas.filter(f => f >= inicio);
  const out = [inicio];
  let objetivo = toDay(inicio);
  // un punto cada 5 días hábiles: la última foto disponible antes de cada corte
  for (;;) {
    let n = 0; let t = objetivo;
    while (n < 5) { t += DAY; if (esHabil(t)) n++; }
    objetivo = t;
    const candidata = posteriores.filter(f => toDay(f) <= objetivo).pop();
    if (toDay(posteriores[posteriores.length - 1]) < objetivo) break;
    if (candidata && candidata !== out[out.length - 1]) out.push(candidata);
  }
  const ultima = posteriores[posteriores.length - 1];
  if (ultima && ultima !== out[out.length - 1]) out.push(ultima);
  return out;
}
async function cargarSupabase(t0) {
  const [catalogo, personas, ausencias, feriados, metas, etapas, snaps] = await Promise.all([
    traerTodo('catalogo', '*'), traerTodo('personas', '*'),
    traerTodo('ausencias', '*', q => q.gte('fecha', isoDay(HOY))),
    traerTodo('feriados', '*'), traerTodo('metas', '*'), traerTodo('etapas_deal', '*'),
    traerTodo('snapshots', 'snapshot_date,creado', q => q.order('snapshot_date')),
  ]);
  const personaEquipos = await traerOpcional('persona_equipos', '*');
  const pronosGuardados = await traerOpcional('pronosticos', 'semana_fecha,etapa_id,sitios,kwp');
  if (!snaps.length) throw new Error('Todavía no hay fotos de HubSpot. Corre el workflow «Foto de HubSpot» en GitHub Actions.');
  FERIADOS = new Set(feriados.map(f => toDay(f.fecha)));
  const fechas = snaps.map(s => s.snapshot_date);
  const ultima = fechas[fechas.length - 1];
  const semanas = elegirSemanas(fechas, t0);
  const [deals, tickets, series] = await Promise.all([
    traerTodo('deals_snapshot', '*', q => q.eq('snapshot_date', ultima)),
    traerTodo('tickets_snapshot', '*', q => q.eq('snapshot_date', ultima)),
    traerTodo('deals_snapshot', 'snapshot_date,deal_id,etapa_id,kwp,segmento', q => q.in('snapshot_date', semanas)),
  ]);
  return { catalogo, personas, ausencias, feriados, metas, etapas, deals, tickets, series, semanas, fechas, ultima, snaps, personaEquipos, pronosGuardados };
}

  const proximos = siguientesHabiles(HOY + 7 * DAY, 3);
  const ausencias = proximos.map(d => ({ owner_id: 'x1', fecha: isoDay(d), horas: 8, fuente: 'factorial' }));
  const metas = [{ mes: isoDay(Date.UTC(new Date(HOY).getUTCFullYear(), new Date(HOY).getUTCMonth(), 1)), sitios: 80, kwp: 1200 }];

  const deals = [];
  const pesos = [14, 12, 16, 22, 18, 30, 26, 12, 10, 14];
  let id = 1000;
  codigos.forEach((c, i) => {
    for (let k = 0; k < pesos[i]; k++) {
      const off = Math.round(2 + (codigos.length - 1 - i) * 3 + rnd() * 18);
      const fecha = rnd() < 0.85 ? isoDay(HOY + (c === '2.15' ? -Math.round(rnd() * 14) : off) * DAY) : null;
      deals.push({ deal_id: String(id++), nombre: `${pick(['SIX', 'NETO', 'MOD'])} sitio ${id}`, segmento: seg, etapa_id: 'e' + c, kwp: Math.round((6 + rnd() * 24) * 10) / 10, fecha_instalacion: fecha });
    }
  });
  const tickets = [];
  let tid = 5000;
  for (const d of deals) {
    const c = d.etapa_id.slice(1); const ti = tipoPorEtapa[c];
    if (ti == null) continue;
    const cdef = catalogo[ti];
    const equipo = dueños[cdef.equipo];
    const owner = rnd() < 0.72 ? equipo[0] : pick(equipo);
    const edad = Math.round(rnd() * (cdef.equipo === 'IX' ? 22 : 12));
    tickets.push({ ticket_id: String(tid++), asunto: d.nombre, tipo: cdef.tipo, segmento: seg, equipo: cdef.equipo,
      etapa_ticket: cdef.esfuerzo_rev_h && rnd() < 0.3 ? 'Under review' : pick(['New', 'In progress']),
      owner_id: owner.owner_id, creado: new Date(HOY - edad * 1.4 * DAY + 15 * 36e5).toISOString(), cerrado: null, deal_ids: [d.deal_id], sitios: 1 });
  }
  for (let k = 0; k < 160; k++) {
    const cdef = pick(catalogo); const owner = pick(dueños[cdef.equipo]);
    const fin = HOY - Math.round(rnd() * 27) * DAY; const dur = Math.round(rnd() * 6) * DAY;
    tickets.push({ ticket_id: String(tid++), asunto: 'Cerrado', tipo: cdef.tipo, segmento: seg, equipo: cdef.equipo, etapa_ticket: 'Closed',
      owner_id: owner.owner_id, creado: new Date(fin - dur + 15 * 36e5).toISOString(), cerrado: new Date(fin + 20 * 36e5).toISOString(), deal_ids: [], sitios: 1 });
  }
  // fotos semanales hacia atrás: cada semana los sitios estaban una etapa antes con cierta probabilidad
  const semanas = []; let t = HOY;
  for (let i = 0; i < 7; i++) { semanas.unshift(isoDay(t)); let n = 0; while (n < 5) { t -= DAY; if (esHabil(t)) n++; } }
  const series = [];
  semanas.forEach((fecha, i) => {
    const atras = semanas.length - 1 - i;
    for (const d of deals) {
      let idx = codigos.indexOf(d.etapa_id.slice(1));
      for (let k = 0; k < atras; k++) if (rnd() < 0.35) idx--;
      if (idx < 0) continue;
      series.push({ snapshot_date: fecha, deal_id: d.deal_id, etapa_id: 'e' + codigos[idx], kwp: d.kwp, segmento: seg });
    }
  });
  return { catalogo, personas, ausencias, feriados, metas, etapas, deals, tickets, series, semanas, fechas: semanas, ultima: semanas[semanas.length - 1],
    snaps: semanas.map(f => ({ snapshot_date: f, creado: new Date(toDay(f) + 13 * 36e5).toISOString() })), pronosGuardados: [] };
}

// ====================== Pronóstico por colas de capacidad ======================
// Un sitio sale de una etapa cuando se cierra su ticket. Por eso casi toda la cadena
// se modela como colas: lo que sale cada semana es lo que el equipo alcanza a cerrar.
// Las etapas que no gobierna un ticket (lotes de 2.01, espera de cuadrilla en 2.14)
// usan los días del Reverse Eng Model, marcados «según proceso».
// Los tiempos por etapa de HubSpot NO se usan: se mueven por lotes, no miden el proceso.
// Sitios que entraron a la cadena por semana en las últimas 4 fotos: deal_ids que
// aparecen y antes no estaban. Es el ritmo real de entrada.
function entradaReal(M) {
  const sem = M.semanas || [];
  if (sem.length < 2) return null;
  // Dos fotos pegadas no dan un ritmo semanal: hacen falta al menos 5 días entre la
  // primera y la última.
  const span = (toDay(sem[sem.length - 1].fecha) - toDay(sem[0].fecha)) / DAY;
  if (!(span >= 5)) return null;
  const desde = Math.max(1, sem.length - 4);
  let nuevos = 0, kwp = 0, intervalos = 0;
  for (let i = desde; i < sem.length; i++) {
    const antes = new Set((sem[i - 1].filas || []).map(r => r.deal_id));
    const entran = (sem[i].filas || []).filter(r => !antes.has(r.deal_id));
    nuevos += entran.length; kwp += sum(entran, r => r.kwp); intervalos++;
  }
  if (!intervalos) return null;
  return { sitios: nuevos / intervalos, kwpPorSitio: nuevos ? kwp / nuevos : 0, intervalos };
}

// Los que tendrían que entrar para sostener la meta, despejando hacia atrás las
// tasas de conversión de toda la cadena.
function entradaMeta(M) {
  const metaMes = M.metricas.goal.sitios || 0;
  const conv = (CFG.ritmoEtapas || []).reduce((a, r) => a * (r.conversion == null ? 1 : r.conversion), 1);
  const porSemana = metaMes / 4.33;
  return { sitios: conv > 0 ? porSemana / conv : 0, conv,
           kwpPorSitio: metaMes ? (M.metricas.goal.kwp || 0) / metaMes : 0 };
}

// Esfuerzo de un tipo de ticket, en orden: catálogo → medido con cierres reales →
// SLA como último recurso. La procedencia viaja con el número y se muestra.
function resolverEsfuerzo(M) {
  const cal = CFG.esfuerzoCalibrado || {};
  const minC = CFG.minCierresEsfuerzo || 10;
  // Esfuerzo medido: horas de la persona que lo cerró entre los cierres de ese tipo.
  const medido = {};
  const porTipo = groupBy(M.tickets.filter(t => t.cerrado28 && t.tipo), t => t.tipo);
  for (const [tipo, ts] of Object.entries(porTipo)) {
    if (ts.length < minC) continue;
    const owners = [...new Set(ts.map(t => t.owner_id))].map(id => M.personas.find(p => p.owner_id === id)).filter(Boolean);
    if (!owners.length) continue;
    const horas = sum(owners, p => p.fte * p.jornada_h * p.foco * 20);
    const cerradosDeEsos = M.tickets.filter(t => t.cerrado28 && owners.some(p => p.owner_id === t.owner_id)).length;
    if (!cerradosDeEsos) continue;
    medido[tipo] = horas / cerradosDeEsos;
  }
  const catPorTipo = {};
  for (const c of (M.catalogo || [])) catPorTipo[c.tipo] = c;
  return function (tipo, esRevision) {
    const c = catPorTipo[tipo];
    const campo = esRevision ? 'esfuerzo_rev_h' : 'esfuerzo_prod_h';
    if (cal[tipo] != null && !esRevision) return { h: cal[tipo], fuente: 'calibrado' };
    const v = c && c[campo] != null && c[campo] !== '' ? Number(c[campo]) : null;
    if (v != null && !isNaN(v)) return { h: v, fuente: 'catálogo' };
    if (medido[tipo] != null) return { h: medido[tipo], fuente: 'medido' };
    const sla = c && c.sla_dias != null && c.sla_dias !== '' ? Number(c.sla_dias) : null;
    // Último recurso: el SLA como duración. La etapa deja de poder mostrar saturación.
    if (sla != null && !isNaN(sla) && sla > 0) return { h: sla * 8, fuente: 'según SLA', porSla: true };
    return { h: null, fuente: 'sin dato' };
  };
}

// Quién puede tomar cada tipo: SKILLS del motor, y si no, quién lo ha cerrado.
function quienesPueden(M) {
  const skills = CFG.skills || {};
  const minS = CFG.minCierresSkill || 3;
  const porTipo = groupBy(M.tickets.filter(t => t.cerrado28 && t.tipo && t.owner_id), t => t.tipo);
  return function (tipo) {
    if (skills[tipo] && skills[tipo].length) return { ids: skills[tipo], fuente: 'skills' };
    const ts = porTipo[tipo] || [];
    const cuenta = {};
    for (const t of ts) cuenta[t.owner_id] = (cuenta[t.owner_id] || 0) + 1;
    const ids = Object.keys(cuenta).filter(id => cuenta[id] >= minS);
    return { ids, fuente: ids.length ? 'quien lo cierra' : 'nadie' };
  };
}

function pronostico(M, sim, opciones) {
  const S = sim || {};
  const O = opciones || {};
  const ritmos = CFG.ritmoEtapas || [];

  const eReal = entradaReal(M), eMeta = entradaMeta(M);
  const pedido = S.entrada || 'real';
  const hayHistoria = !!eReal;
  const modoEntrada = pedido === 'meta' ? 'meta' : (hayHistoria ? 'real' : 'sin-historia');
  const nuevos = modoEntrada === 'real' ? eReal : eMeta;

  const esfuerzo = resolverEsfuerzo(M);
  const puede = quienesPueden(M);
  const factor = (S.focoFactor == null ? 1 : S.focoFactor);

  // Horas por semana de cada persona, con los ajustes del simulador.
  const horasPersona = {};
  for (const p of M.personas) {
    const porDia = M.dias.length ? p.dispH / M.dias.length : 0;
    horasPersona[p.owner_id] = porDia * factor * 5;
  }
  // Personas extra: se agregan como capacidad suelta del equipo.
  const extraEquipo = {};
  for (const [eq, n] of Object.entries(S.extraPersonas || {})) extraEquipo[eq] = n * 8 * 0.8 * 5;

  // Reparto: cada persona divide su semana entre las filas que puede tomar, en
  // proporción al tamaño de cada fila.
  let repartoPersona = {};
  const fijarColas = (colas, estado) => {
    repartoPersona = {};
    const tamanos = {};   // tipo -> sitios esperando
    for (const lista of Object.values(colas)) for (const c of lista)
      tamanos[c.tipo] = (tamanos[c.tipo] || 0) + ((estado[c.etapa.id] || {}).sitios || 0);
    const tiposDe = {};
    for (const tipo of Object.keys(tamanos)) {
      for (const id of puede(tipo).ids) (tiposDe[id] = tiposDe[id] || []).push(tipo);
      // El revisor tiene su propia fila del mismo tipo.
      for (const id of (CFG.revisores || {})[tipo] || []) (tiposDe[id] = tiposDe[id] || []).push(tipo + ' · revisión');
    }
    for (const tipo of Object.keys(tamanos)) tamanos[tipo + ' · revisión'] = tamanos[tipo];
    for (const [id, tipos] of Object.entries(tiposDe)) {
      const total = sum(tipos, t => tamanos[t] || 0);
      for (const t of tipos) {
        const parte = total > 0 ? (tamanos[t] || 0) / total : 1 / tipos.length;
        repartoPersona[t] = (repartoPersona[t] || 0) + (horasPersona[id] || 0) * parte;
      }
    }
  };
  const revisores = CFG.revisores || {};
  const horasPara = (tipo, equipo, etapaId, w, esRevision) => {
    const q = esRevision && revisores[tipo] ? { ids: revisores[tipo], fuente: 'revisores' } : puede(tipo);
    const clave = esRevision && revisores[tipo] ? tipo + ' · revisión' : tipo;
    if (q.ids.length) return { h: (repartoPersona[clave] || 0) + (extraEquipo[equipo] || 0), quienes: q };
    // Sin personas identificadas, se usa la capacidad del equipo entero.
    const eq = M.equipos.find(x => x.nombre === equipo);
    const porDia = eq && M.dias.length ? eq.dispH / M.dias.length : 0;
    return { h: porDia * factor * 5 + (extraEquipo[equipo] || 0), quienes: { ids: [], fuente: 'equipo completo' } };
  };

  const capSemana = {};
  for (const e of M.equipos) {
    const porDia = M.dias.length ? e.dispH / M.dias.length : 0;
    capSemana[e.nombre] = porDia * factor * 5 + (extraEquipo[e.nombre] || 0);
  }
  const estado = {};
  for (const e of M.porEtapa) estado[e.etapa_id] = { sitios: e.sitios, kwp: e.kwp };

  const slaDe = tipo => {
    const c = (M.catalogo || []).find(x => x.tipo === tipo);
    const v = c && c.sla_dias != null && c.sla_dias !== '' ? Number(c.sla_dias) : null;
    return v == null || isNaN(v) ? null : v;
  };

  const comun = {
    ritmos, capSemana, nuevos, semanas: CFG.semanasPronostico || 10,
    ajustes: { multEsfuerzo: S.multEsfuerzo, diasEtapa: S.diasEtapa },
    esfuerzo, sla: slaDe, horasPara, fijarColas,
  };
  const R = NIKO_MODELO.calcularPronostico({ ...comun, estado: { ...estado } });
  // La promesa: lo mismo pero suponiendo que cada ticket cierra en su SLA.
  const Prom = O.sinPromesa ? null : NIKO_MODELO.calcularPronostico({
    ...comun, estado: { ...estado }, promesa: true,
    horasPara: () => ({ h: 0, quienes: { ids: [] } }),
  });

  // Etapas cuyo ritmo salió del SLA por falta de esfuerzo: no pueden mostrar saturación.
  const porSla = [];
  for (const r of ritmos) for (const t of (r.tickets || [])) {
    const e2 = esfuerzo(t.tipo, t.revision);
    if (e2.porSla) porSla.push(`${r.cod} · ${t.tipo}`);
  }

  // El plan de ensueño: hacia atrás desde la meta mensual.
  const metaMes = (S.meta != null ? S.meta : M.metricas.goal.sitios) || 0;
  const kwpPorSitio = M.metricas.goal.sitios ? M.metricas.goal.kwp / M.metricas.goal.sitios : 15;
  const Meta = NIKO_MODELO.calcularMeta({
    ritmos, metaSemana: metaMes / 4.33, kwpPorSitio,
    semanas: CFG.semanasPronostico || 10, sla: slaDe, esfuerzo,
    tasaPuntaAPunta: (CFG.tasaDesdeLevantamiento || {}).observada,
  });

  return { ...R, promesa: Prom, meta: Meta, metaMes, capSemana, entrada: nuevos, modoEntrada,
           eReal, eMeta, hayHistoria, porSla, esfuerzoDe: esfuerzo, quienesPueden: puede };
}

// ====================== Olas: dónde hay que prepararse ======================
// Una ola es un grupo de sitios que hoy están en una etapa y que, al avanzar, van a
// caer sobre un paso que no da abasto. Todo sale del mismo pronóstico.
function olas(M, P) {
  if (!P || !P.semanas.length) return [];
  const ritmos = CFG.ritmoEtapas || [];
  const nombrePersona = id => (M.personas.find(p => p.owner_id === id) || {}).nombre || id;
  const etiqueta = id => (M.porEtapa.find(e => e.etapa_id === id) || {}).etiqueta || id;
  const out = [];

  ritmos.forEach((r, i) => {
    if (r.modo !== 'cola') return;
    // La semana en la que más sitios llegan a esta etapa.
    let mejor = null;
    P.semanas.forEach((w, wi) => {
      const t = w.traza[r.id];
      if (t && t.llegaron > (mejor ? mejor.llegaron : 0)) mejor = { llegaron: t.llegaron, wi, t };
    });
    if (!mejor || mejor.llegaron < 1) return;
    const t = mejor.t, p = t.porque || {};
    if (p.modo !== 'cola' || !p.cuello) return;
    const cuello = p.cuello;
    // Solo es alerta si el paso no alcanza a absorber lo que llega.
    const capacidadSemana = cuello.caben;
    if (capacidadSemana >= mejor.llegaron) return;

    const origen = ritmos[i - 1];
    const sitiosOrigen = origen ? (M.porEtapa.find(e => e.etapa_id === origen.id) || {}).sitios || 0 : 0;
    const destino = ritmos[i + 1];
    const quienes = (cuello.quienes && cuello.quienes.ids) || [];
    const unaPersona = quienes.length === 1;

    // Retraso contra la promesa: semanas que tarda la capacidad menos las que promete el SLA.
    const semCap = capacidadSemana > 0 ? mejor.llegaron / capacidadSemana : Infinity;
    const promTraza = P.promesa && P.promesa.semanas[mejor.wi] && P.promesa.semanas[mejor.wi].traza[r.id];
    const semProm = promTraza && promTraza.porque.fraccion > 0 ? 1 / promTraza.porque.fraccion : 1;
    const retrasoDias = Number.isFinite(semCap) ? Math.max(0, Math.round((semCap - semProm) * 5)) : null;

    // Desfase contra el mes comprometido. Aproximación: dentro de la etapa los sitios
    // avanzan por orden de fecha_instalacion (los más urgentes primero), así que el que
    // está en la posición k sale en la semana ceil(k / lo que sale por semana).
    const enEtapa = [...((M.porEtapa.find(e => e.etapa_id === r.id) || {}).ds || [])]
      .filter(d => d.fecha_instalacion)
      .sort((a, b) => String(a.fecha_instalacion).localeCompare(String(b.fecha_instalacion)));
    const fuera = [];
    if (capacidadSemana > 0) {
      enEtapa.forEach((d, k) => {
        const semanaSalida = Math.ceil((k + 1) / capacidadSemana);
        const salida = siguientesHabiles(HOY, semanaSalida * 5).pop();
        const f = toDay(d.fecha_instalacion);
        if (f == null) return;
        // Fin del mes comprometido de ese sitio.
        const dd = new Date(f);
        const finMes = Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth() + 1, 1) - DAY;
        if (salida > finMes) fuera.push({ ...d, salidaEstimada: isoDay(salida) });
      });
    } else {
      fuera.push(...enEtapa);
    }
    const kwpPorSitio = t.fin > 0 ? t.kwpFin / t.fin : 0;
    const seQuedan = Math.max(0, mejor.llegaron - capacidadSemana);
    out.push({
      cod: r.cod, etapaId: r.id, etiqueta: etiqueta(r.id),
      origenCod: origen ? origen.cod : null, sitiosOrigen,
      destinoCod: destino ? destino.cod : 'instalación',
      semana: mejor.wi + 1, llegan: mejor.llegaron,
      paso: cuello.tipo, equipo: cuello.equipo, sacaPorSemana: capacidadSemana,
      quienes, unaPersona, quienFuente: (cuello.quienes || {}).fuente,
      sinCapacidad: !!cuello.sinCapacidad,
      retrasoDias, seQuedan, kwp: seQuedan * kwpPorSitio,
      desfase: fuera, desfaseKwp: sum(fuera, d => d.kwp || 0),
      traza: t,
    });
  });
  return out.sort((a, b) => (b.desfaseKwp || b.kwp) - (a.desfaseKwp || a.kwp));
}

function fraseOla(o) {
  const quien = o.sinCapacidad
    ? `No hay nadie en la tabla de personas para ${esc(o.equipo)}, que es quien debería tomarlos; el pronóstico los mueve a ${fmt1.format(o.sacaPorSemana)} por semana según el SLA`
    : o.unaPersona
      ? `Los trabaja <b>una sola persona</b>, ${esc((o.quienesNombres || [])[0] || o.equipo)}, que saca ${fmt1.format(o.sacaPorSemana)} por semana`
      : `Los trabajan ${o.quienes.length} personas de ${esc(o.equipo)}, que sacan ${fmt1.format(o.sacaPorSemana)} por semana`;
  return `En <b>${esc(o.cod)}</b> se juntan <b>${fmt1.format(o.llegan)} sitios</b> en ${o.semana}S`
    + (o.origenCod ? `, que hoy vienen de ${esc(o.origenCod)}` : '')
    + `. ${quien}`
    + (o.retrasoDias ? `, así que el paso a ${esc(o.destinoCod)} se retrasa <b>${o.retrasoDias} ${o.retrasoDias === 1 ? 'día hábil' : 'días hábiles'}</b> contra la promesa` : '')
    + `. Se quedan fuera ${fmt1.format(o.seQuedan)} sitios y ${fmt.format(Math.round(o.kwp))} kWp`
    + (o.desfase && o.desfase.length
        ? `, y <b>${o.desfase.length} ${o.desfase.length === 1 ? 'sitio se sale' : 'sitios se salen'} de su mes de instalación</b> (${fmt.format(Math.round(o.desfaseKwp))} kWp).`
        : ', y ninguno se sale de su mes de instalación.');
}

const ESTADO = { raw: null, modelo: null, tab: 'flujo', unidad: 'sitios', horizonte: CFG.horizonteDias || 10, mes: isoDay(HOY).slice(0, 7), segmento: null, t0: null,

}

// ---------- Vínculos a HubSpot ----------
function hsUrl(obj, id) {

    ? `https://app.hubspot.com/contacts/${CFG.hubspotPortalId}/record/${obj}/${encodeURIComponent(id)}` : null;
}
function hsTicket(id, texto) {
  const u = hsUrl('0-5', id);

  return u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t;
}
function hsDeal(id, texto) {

// ---------- Panel de detalle: todo número agregado abre su lista ----------
const DRILL = new Map();
let drillSeq = 0;
// Dos clases de número:
//  - conteo: el panel debe tener exactamente tantos registros como dice la cifra.
//  - derivado (mediana, promedio, %, horas, días, utilización): no se cuenta, se explica
//    cómo se calculó, se ordena por el campo relevante y se resalta el que la marca.
function num(texto, titulo, registros, tipo, o) {
  const lista = registros || [];
  if (!lista.length) return texto;
  const id = 'd' + (++drillSeq);
  DRILL.set(id, { titulo, registros: lista, tipo, mostrado: texto,
    explica: (o && o.explica) || null, ordenar: (o && o.ordenar) || null, resaltar: (o && o.resaltar) || null });
  return `<button class="num" type="button" data-d="${id}">${texto}</button>`;
}
const COLS = {
  tickets: [
    ['id', 'Ticket', t => hsTicket(t.ticket_id, t.ticket_id), t => t.ticket_id],
    ['asunto', 'Asunto', t => `<span title="${esc(t.asunto || '')}">${esc(t.asunto || '')}</span>`, t => t.asunto || '', 'asunto'],
    ['tipo', 'Tipo', t => esc(t.tipo || '—'), t => t.tipo || ''],
    ['owner', 'Owner', t => esc(t.persona ? t.persona.nombre : (t.owner_id || 'Sin owner')), t => t.persona ? t.persona.nombre : (t.owner_id || '')],
    ['etapa', 'Etapa', t => esc(t.etapa_ticket || '—'), t => t.etapa_ticket || ''],
    ['edad', 'Edad', t => t.edad == null ? '—' : fmt1.format(t.edad) + ' d', t => t.edad ?? -1],
    ['sla', 'SLA', t => slaTxt(t.sla), t => t.sla ?? -1],
    ['atraso', 'Atraso', t => (t.sla == null || t.edad == null) ? '—' : fmt1.format(Math.max(0, t.edad - t.sla)) + ' d', t => (t.sla == null || t.edad == null) ? -1 : t.edad - t.sla],
    ['estado', 'Estado', t => pillSla(t), t => t.estadoSla || ''],
  ],
  sitios: [
    ['nombre', 'Sitio', d => hsDeal(d.deal_id, d.nombre || d.deal_id), d => d.nombre || ''],
    ['etapa', 'Etapa', d => esc(d.etapaEtiqueta || d.etapa_id || '—'), d => d.etapaEtiqueta || ''],
    ['kwp', 'kWp', d => fmt1.format(d.kwp || 0), d => d.kwp || 0],
    ['inst', 'Instalación', d => esc(d.fecha_instalacion || '—'), d => d.fecha_instalacion || ''],
  ],
};
// El Delta no es una lista de registros sino una brecha: se descompone en sus dos
// partes, que por construcción suman exactamente el delta.
function num_delta(texto, titulo, d) {
  const id = 'd' + (++drillSeq);
  DRILL.set(id, { titulo, tipo: 'delta', desglose: d, registros: d.fuera, mostrado: texto, calc: null });
  return `<button class="num" type="button" data-d="${id}">${texto}</button>`;
}
// El desglose de una celda de pronóstico: de dónde sale ese número.
function numPron(texto, titulo, t, etiqueta) {
  const id = 'd' + (++drillSeq);
  DRILL.set(id, { titulo, tipo: 'desglose', traza: t, etapaEtiqueta: etiqueta, mostrado: texto, registros: [] });
  return `<button class="num" type="button" data-d="${id}">${texto}</button>`;
}
function numInst(texto, titulo, inst, etiqueta) {
  const id = 'd' + (++drillSeq);
  DRILL.set(id, { titulo, tipo: 'instalados', inst, etapaEtiqueta: etiqueta, mostrado: texto, registros: [] });
  return `<button class="num" type="button" data-d="${id}">${texto}</button>`;
}
function numMeta(texto, titulo, n, P) {
  const id = 'd' + (++drillSeq);
  DRILL.set(id, { titulo, tipo: 'meta', n, P, mostrado: texto, registros: [] });
  return `<button class="num" type="button" data-d="${id}">${texto}</button>`;
}
const PANEL = { id: null, orden: null, asc: true, origen: null };
function abrirDetalle(id, boton) {
  const d = DRILL.get(id);
  if (!d) return;
  PANEL.id = id; PANEL.orden = null; PANEL.asc = true; PANEL.origen = boton || null;
  pintarDetalle();
  const el = document.getElementById('panel-det');
  el.hidden = false;
  document.getElementById('pd-x').focus();
}
function cerrarDetalle() {
  const el = document.getElementById('panel-det');
  if (!el || el.hidden) return;
  el.hidden = true;
  if (PANEL.origen && document.body.contains(PANEL.origen)) PANEL.origen.focus();
  PANEL.id = null; PANEL.origen = null;
}
function pintarDetalle() {
  const d = DRILL.get(PANEL.id);
  if (!d) return;
  document.getElementById('pd-t').textContent = d.titulo;
  const cols = COLS[d.tipo] || COLS.tickets;
  let filas = [...(d.registros || [])];
  if (!PANEL.orden && d.ordenar) { PANEL.orden = d.ordenar; PANEL.asc = true; }
  if (PANEL.orden) {
    const c = cols.find(x => x[0] === PANEL.orden);
    if (c) filas.sort((a, b) => {
      const va = c[3](a), vb = c[3](b);
      const r = typeof va === 'number' && typeof vb === 'number' ? va - vb : String(va).localeCompare(String(vb), 'es');
      return PANEL.asc ? r : -r;
    });
  }
  if (d.explica) {
    // Número derivado: no se cuenta contra la lista, se explica.
    document.getElementById('pd-n').textContent = d.explica;
  } else {
    // Conteo: la lista tiene que tener exactamente tantos registros como dice la cifra.
    const mostrado = Number(String(d.mostrado).replace(/[^0-9.-]/g, ''));
    const cuadra = !Number.isFinite(mostrado) || d.registros.length === mostrado;
    document.getElementById('pd-n').innerHTML = `${fmt.format(d.registros.length)} ${d.registros.length === 1 ? 'registro' : 'registros'}`
      + (cuadra ? '' : `<span class="pd-mal">No cuadra: la cifra dice ${esc(d.mostrado)} y la lista tiene ${fmt.format(d.registros.length)}</span>`);
  }
  if (d.tipo === 'meta') {
    const n = d.n, P = d.P;
    document.getElementById('pd-n').textContent = 'De dónde sale lo que pide la meta, calculado hacia atrás';
    document.getElementById('pd-c').innerHTML = `<div class="tabla"><table>
      <tbody>
        <tr><td class="izq">Meta del mes</td><td>${fmt.format(P.metaMes)} sitios</td><td class="izq">≈ ${fmt1.format(P.metaMes / 4.33)} instalaciones por semana</td></tr>
        <tr><td class="izq">Deben entrar a ${esc(n.cod)}</td><td>${fmt1.format(n.entranSemana)}</td><td class="izq">por semana, despejando las conversiones de las etapas siguientes</td></tr>
        <tr><td class="izq">Tarda</td><td>${fmt1.format(n.dias)} d</td><td class="izq">días hábiles según el SLA de sus tickets</td></tr>
        <tr class="marca"><td class="izq"><b>Sitios parados a la vez</b></td><td><b>${fmt1.format(n.sitios)}</b></td><td class="izq">lo que entra por semana × las semanas que tarda</td></tr>
        <tr><td class="izq">Sobreviven</td><td>${pct(n.conversion)}</td><td class="izq">tasa de conversión del Reverse Eng Model</td></tr>
      </tbody></table></div>
      <p class="nota">Para toda la cadena, la meta pediría que entraran <b>${fmt1.format(P.meta.entradaSemana)} sitios por semana</b> a la primera etapa. Es el plan de ensueño: supone que cada ticket se cumple en su SLA.</p>`;
    return;
  }
  if (d.tipo === 'desglose') {
    const t = d.traza, p = t.porque || {};
    const n1 = x => fmt1.format(x);
    const cuadra = Math.abs((t.inicio + t.llegaron - t.salieron + t.nuevos) - t.fin) < 0.05;
    const paso = x => `<tr${x === p.cuello ? ' class="marca"' : ''}><td class="izq">${esc(x.tipo)}</td><td class="izq">${esc(x.equipo)}</td>`
      + `<td>${x.sinCapacidad ? '—' : n1(x.horas) + ' h'}</td><td>${n1(x.esfuerzo)} h</td><td>${n1(x.caben)}</td>`
      + `<td class="izq">${x.sinCapacidad ? `<span class="supuesto">sin capacidad modelada · avanza por SLA de ${n1(x.dias)} d</span>` : `<span class="supuesto">${esc(x.fuente)}</span>`}${x.quienes && x.quienes.ids.length ? ` · ${x.quienes.ids.length} ${x.quienes.ids.length === 1 ? 'persona' : 'personas'} <span class="supuesto">(${esc(x.quienes.fuente)})</span>` : x.quienes ? ` <span class="supuesto">(${esc(x.quienes.fuente)})</span>` : ''}</td></tr>`;
    const motivo = p.modo === 'cola'
      ? `La etapa va al ritmo de su paso más lento: <b>${esc((p.cuello || {}).tipo || '—')}</b>, que deja pasar <b>${n1(p.caben)} sitios</b>.${p.topado ? ` Solo había ${n1(t.inicio + t.llegaron)}, así que salen todos.` : ''}
         <table class="pasos"><thead><tr><th class="izq">Paso</th><th class="izq">Equipo</th><th>Horas</th><th>c/u</th><th>Caben</th><th class="izq">De dónde</th></tr></thead>
         <tbody>${(p.pasos || []).map(paso).join('')}</tbody></table>`
      : p.modo === 'promesa'
        ? `Promesa del catálogo: ${n1(p.dias)} días hábiles${p.sec && p.par ? ` (${n1(p.sec)} en secuencia + ${n1(p.par)} del paralelo más lento)` : ''}: sale <b>${pct(p.fraccion)}</b> por semana.`
      : p.modo === 'sin-sla'
        ? `<span class="pd-mal">Sin SLA en el catálogo para ${(p.tickets || []).map(esc).join(', ')}: no se puede calcular la promesa.</span>`
      : p.modo === 'proceso'
        ? `Según proceso, ${n1(p.dias)} días hábiles${p.nota ? ` (${esc(p.nota)})` : ''}: en una semana de 5 días sale <b>${pct(p.fraccion)}</b> de lo que hay. <span class="supuesto">días del Reverse Eng Model</span>`
        : p.modo === 'sin-esfuerzo'
          ? `<span class="pd-mal">${esc(p.ticket)}: sin esfuerzo en el catálogo, sin cierres suficientes para medirlo y sin SLA. La etapa queda detenida.</span>`
          : 'No había sitios en la etapa.';
    document.getElementById('pd-n').innerHTML = `Semana a semana, así se arma el número${cuadra ? '' : '<span class="pd-mal">Las cuentas no cuadran con la celda</span>'}`;
    document.getElementById('pd-c').innerHTML = `<div class="tabla"><table>
      <tbody>
        <tr><td class="izq">Al empezar la semana</td><td>${n1(t.inicio)}</td><td class="izq">sitios en ${esc(d.etapaEtiqueta)}</td></tr>
        <tr><td class="izq">+ Llegaron</td><td>${n1(t.llegaron)}</td><td class="izq">${t.deCod ? `de ${esc(t.deCod)}, ya descontada su pérdida` : '—'}</td></tr>
        ${t.nuevos ? `<tr><td class="izq">+ Entraron nuevos</td><td>${n1(t.nuevos)}</td><td class="izq">sitios que entran a la cadena esta semana</td></tr>` : ''}
        <tr><td class="izq">− Salieron</td><td>${n1(t.salieron)}</td><td class="izq">${motivo}</td></tr>
        <tr class="marca"><td class="izq"><b>Al terminar la semana</b></td><td><b>${n1(t.fin)}</b></td><td class="izq">${fmt.format(Math.round(t.kwpFin))} kWp</td></tr>
      </tbody></table></div>
      ${t.salieron > 0 && t.conversion < 1 ? `<p class="nota">De los ${n1(t.salieron)} que salieron, <b>${n1(t.perdidos)} se pierden</b> en el camino: la tasa de conversión de esta etapa es ${pct(t.conversion)}, del Reverse Eng Model. A la siguiente llegan ${n1(t.salieron - t.perdidos)}.</p>` : ''}`;
    return;
  }
  if (d.tipo === 'instalados') {
    const i = d.inst;
    document.getElementById('pd-n').textContent = 'Sitios que llegan a instalación esa semana';
    document.getElementById('pd-c').innerHTML = `<div class="tabla"><table>
      <tbody>
        <tr><td class="izq">Vinieron de</td><td class="izq">${esc(i.deEtiqueta || '—')}, la última etapa de la cadena</td></tr>
        <tr class="marca"><td class="izq"><b>Sitios</b></td><td><b>${fmt1.format(i.sitios)}</b></td></tr>
        <tr><td class="izq">kWp</td><td>${fmt.format(i.kwp)}</td></tr>
      </tbody></table></div>
      <p class="nota">Son los que salen de la última etapa ya descontada su tasa de conversión. Es un pronóstico, no una fecha comprometida.</p>`;
    return;
  }
  if (d.tipo === 'delta') {
    const g = d.desglose;
    const sig = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt1.format(Math.abs(n));
    const suma = g.aportePlan + g.aporteCapacidad;
    const cuadraD = Math.abs(suma - g.delta) < 0.05;
    document.getElementById('pd-n').innerHTML = `El delta se arma de dos partes${cuadraD ? '' : '<span class="pd-mal">No cuadra: las partes dan ' + fmt1.format(suma) + ' y el delta es ' + fmt1.format(g.delta) + '</span>'}`;
    document.getElementById('pd-c').innerHTML = `<div class="tabla"><table>
      <thead><tr><th class="izq">Parte</th><th>${esc(g.unidad)}</th><th class="izq">Qué es</th></tr></thead>
      <tbody>
        <tr><td class="izq">Brecha de plan</td><td>${sig(g.aportePlan)}</td><td class="izq">Goal ${fmt1.format(g.goal)} contra ${fmt1.format(g.plan)} comprometidos: faltan sitios con fecha de instalación en el mes.</td></tr>
        <tr><td class="izq">Brecha de capacidad</td><td>${sig(g.aporteCapacidad)}</td><td class="izq">De los comprometidos, ${g.fuera.length} no entran en el forecast por fila y SLA.</td></tr>
        <tr><td class="izq"><b>Delta</b></td><td><b>${sig(g.delta)}</b></td><td class="izq">Forecast ${fmt1.format(g.forecast)} contra goal ${fmt1.format(g.goal)}.</td></tr>
      </tbody></table></div>
      ${g.fuera.length ? `<h3 style="font-size:13px;margin:12px 0 6px">Los ${g.fuera.length} que no entran</h3><div class="tabla"><table>
        <thead><tr><th class="izq">Sitio</th><th>kWp</th><th>Instalación</th><th class="izq">Por qué no entra</th></tr></thead>
        <tbody>${g.fuera.map(r => `<tr><td class="izq">${hsDeal(r.deal.deal_id, r.deal.nombre || r.deal.deal_id)}</td><td>${fmt1.format(r.deal.kwp || 0)}</td><td>${esc(r.deal.fecha_instalacion || '—')}</td><td class="izq">${esc(r.motivo)}</td></tr>`).join('')}</tbody>
      </table></div>` : ''}`;
    return;
  }
  document.getElementById('pd-c').innerHTML = `<div class="tabla"><table>
    <thead><tr>${cols.map(c => `<th class="izq"><button type="button" class="pd-ord" data-c="${c[0]}" aria-sort="${PANEL.orden === c[0] ? (PANEL.asc ? 'ascending' : 'descending') : 'none'}">${esc(c[1])}${PANEL.orden === c[0] ? (PANEL.asc ? ' ↑' : ' ↓') : ''}</button></th>`).join('')}</tr></thead>
    <tbody>${(() => { const marca = d.resaltar ? d.resaltar(filas) : null;
      return filas.map((r, i) => `<tr${marca && marca.has(i) ? ' class="marca"' : ''}>${cols.map(c => `<td class="izq ${c[4] || ''}">${c[2](r)}</td>`).join('')}</tr>`).join(''); })()}</tbody>
  </table></div>`;
  document.querySelectorAll('.pd-ord').forEach(b => b.addEventListener('click', () => {

  catch (e) { return new Set(); }
})();
function guardarAbiertas() {

}
function seccion(id, titulo, defId, resumen, fuente, contenido) {
